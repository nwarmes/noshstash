        <button class="btn ghost danger" data-act="g-clear-all">${S.deleteArm === "grocery" ? "Tap again to clear all" : "Clear all"}</button>
      </div>
      <p class="note">Tip: Copy list, then paste into a new iPhone Reminders list. Each line becomes its own reminder.</p>` : ""}`;
  }

  function settingsView() {
    return `<div class="section-head"><h2>Settings</h2><button class="btn ghost small" data-act="settings-close">Done</button></div>
      <div class="grid-gap">
        <form class="panel" id="gate">
          <h3>Your name on this phone</h3>
          <label for="g-name">Name<input id="g-name" type="text" autocomplete="given-name" value="${esc(S.me)}" required></label>
          <div class="row"><button class="btn primary" type="submit">Save name</button></div>
        </form>
        <div class="panel">
          <h3>Save from the share button</h3>
          <p class="note" style="margin:0">Set up a one-time Apple Shortcut so Instagram, Safari and Messages can send recipes straight here. Do it once on each phone.</p>
          <ol class="howto">
            <li>Open the <b>Shortcuts</b> app, tap <b>+</b>, and name it <b>Save to Nosh Stash</b>.</li>
            <li>Tap the <b>ⓘ</b> (or the name at the top) and turn on <b>Show in Share Sheet</b>. Set it to receive <b>URLs</b>, <b>Text</b> and <b>Safari web pages</b>.</li>
            <li>Add the action <b>Get Contents of URL</b>. Paste this as the URL:
              <div class="copybox"><code id="apiUrl">${esc(API_URL)}</code><button class="btn small" data-copy="apiUrl">Copy</button></div></li>
            <li>In that action tap <b>Show More</b>: Method <b>POST</b>, Request Body <b>JSON</b>. Add these fields:
              <ul><li><code>action</code> (Text): <code>quickAdd</code></li><li><code>passcode</code> (Text): your household passcode</li>
              <li><code>data</code> (Dictionary) with three Text fields inside: <code>url</code> = <b>Shortcut Input</b>, <code>text</code> = <b>Shortcut Input</b>, <code>by</code> = <code>${esc(S.me)}</code></li></ul></li>
            <li>Add <b>Get Dictionary Value</b>: get <b>Value</b> for <code>message</code> in <b>Contents of URL</b>.</li>
            <li>Add <b>Show Notification</b> with the <b>Dictionary Value</b>.</li>
          </ol>
          <p class="note" style="margin:0">Then in Instagram or Safari tap <b>Share → Save to Nosh Stash</b>. It's organized and saved in the background. Instagram posts usually land in <b>Needs details</b> because Instagram hides captions.</p>
        </div>
        <div class="panel">
          <h3>Backup</h3>
          <p class="note" style="margin:0">Everything also lives in your Recipe Finder Google Sheet. This downloads a copy you can keep anywhere.</p>
          <div class="row"><button class="btn" data-act="backup">Download backup</button></div>
        </div>
        <div class="panel">
          <h3>This phone</h3>
          <p class="note" style="margin:0">Locking removes the passcode and the saved offline copy from this phone.</p>
          <div class="row"><button type="button" class="btn ghost danger" data-act="lock">Lock this phone</button></div>
        </div>
      </div>`;
  }

  function addView() {
    if (!S.canWrite) return `<div class="empty"><strong>View only</strong>Ask the owner to give you Contributor access to add recipes.</div>`;
    if (S.draft) return `<div class="section-head"><h2>Check and save</h2></div>${editForm(S.draft, "draft")}`;
    const busy = S.busy ? `<span class="working"><span class="spin"></span>Reading the recipe…</span>` : "";
    const err = S.err ? `<div class="error">${esc(S.err)}</div>` : "";
    const ai = S.canAI;
    let panel = "";
    if (S.addMode === "paste") {
      panel = `<label for="pasteBox">Paste it here<span class="hint">A link, the caption, a texted recipe, or all of it at once. The recipe gets pulled out and organized as soon as you paste.</span>
          <textarea id="pasteBox" style="min-height:190px" placeholder="https://www.instagram.com/p/…&#10;&#10;🔥 The BEST 20 minute pasta 🔥 You need: 8 oz rigatoni, 2 tbsp butter…">${esc(S.paste)}</textarea></label>
        <div id="pasteCtl" class="grid-gap" style="gap:10px">${pasteControls()}</div>`;
    } else {
      panel = `<div class="drop">
          ${S.photoUrl ? `<img src="${esc(S.photoUrl)}" alt="Selected recipe photo">` : `<div>Choose a screenshot or a photo of a cookbook page.</div>`}
          <label class="btn" for="photoIn" style="font-weight:700">${S.photoUrl ? "Choose a different photo" : "Choose photo"}</label>
          <input id="photoIn" type="file" accept="image/*" hidden>
        </div>
        <div class="row">
          ${ai && S.canImages ? `<button class="btn primary" data-act="photo-extract" ${S.photo && !S.busy ? "" : "disabled"}>Read recipe from photo</button>` : ""}
          <button class="btn" data-act="photo-manual" ${S.photo && !S.busy ? "" : "disabled"}>Save photo, fill in by hand</button>
        </div>
        ${ai && !S.canImages ? `<div class="note">Reading recipes from photos isn't available here, so you can save the photo and type the details.</div>` : ""}`;
    }
    return `<div class="section-head"><h2>Add a recipe</h2></div>
      <div class="seg" role="group" aria-label="How are you adding it?" style="grid-template-columns:1fr 1fr">
        <button data-mode="paste" aria-pressed="${S.addMode === "paste"}">Paste link or text</button>
        <button data-mode="photo" aria-pressed="${S.addMode === "photo"}">Screenshot or photo</button>
      </div>
      <div class="panel">${panel}${busy}${err}</div>
      ${!ai && S.loaded ? `<p class="note">Automatic organizing turns on once an Anthropic API key is added to the backend. You can still save everything by hand.</p>` : ""}`;
  }

  function pasteControls() {
    const { url, rest } = splitPaste(S.paste);
    const linkOnly = url && rest.length < 15;
    const ai = S.canAI;
    const social = /instagram|tiktok|facebook/i.test(url);
    const pending = S.pendingUrl ? `<div class="row" style="align-items:center"><img src="${esc(S.pendingUrl)}" referrerpolicy="no-referrer" alt="Attached cover photo" style="width:56px;height:56px;object-fit:cover;border-radius:8px"><span class="note">Cover photo attached</span><button class="btn ghost" data-act="drop-pending" style="padding:6px 12px">Remove</button></div>` : "";
    return `${pending}${url ? `<div class="note">Link found: <b>${esc(sourceOf(url) || url)}</b>${linkOnly && social ? ". Instagram and TikTok usually block apps from reading posts, so paste the caption in too for the full recipe." : ""}</div>` : ""}
      <div class="row">
        ${ai ? `<button class="btn primary" data-act="paste-extract" ${S.busy || (!rest && !url) ? "disabled" : ""}>${linkOnly ? "Organize from link" : "Organize recipe"}</button>` : ""}
        ${url ? `<button class="btn ${!ai ? "primary" : ""}" data-act="paste-quick" ${S.busy ? "disabled" : ""}>Save link, add recipe later</button>` : ""}
        ${!linkOnly ? `<button class="btn ghost" data-act="paste-manual" ${S.busy || !S.paste.trim() ? "disabled" : ""}>Fill in by hand</button>` : ""}
      </div>`;
  }

  function editForm(d, ctx) {
    return `<form class="panel" id="editForm" data-ctx="${ctx}">
      <div id="dupWarn" class="warn" hidden></div>
      ${d._warn ? `<div class="error">${esc(d._warn)}</div>` : ""}
      <label for="f-title">Title<input id="f-title" type="text" value="${esc(d.title)}" required></label>
      ${(() => { const k = ctx + ":" + (d.id || "draft"); if (S.formKey !== k) { S.formKey = k; S.formImages = (d.images || []).slice(); } return ""; })()}
      <div id="formPhotos">${formPhotosHTML()}</div>
      <label for="f-sum">One-line description<input id="f-sum" type="text" value="${esc(d.summary || "")}" placeholder="Optional"></label>
      <div class="row" style="align-items:stretch">
        <label for="f-url" style="flex:2;min-width:180px">Link<input id="f-url" type="url" value="${esc(d.sourceUrl || "")}" placeholder="Optional"></label>
        <label for="f-credit" style="flex:1;min-width:120px">Credit<input id="f-credit" type="text" value="${esc(d.credit || "")}" placeholder="@creator"></label>
      </div>
      <div class="row" style="align-items:stretch">
        <label for="f-time" style="flex:1">Time<input id="f-time" type="text" value="${esc(d.time || "")}" placeholder="35 min"></label>
        <label for="f-serv" style="flex:1">Serves<input id="f-serv" type="text" value="${esc(d.servings || "")}" placeholder="4"></label>
      </div>
      <label for="f-tags">Tags<span class="hint">Comma separated, like weeknight, pasta, vegetarian</span><input id="f-tags" type="text" value="${esc((d.tags || []).join(", "))}"></label>
      <label for="f-coll">Collections<span class="hint">Your own groupings, like Date night, Freezer meals, Thanksgiving. Comma separated.${allCollections().length ? " Yours: " + allCollections().map(esc).join(", ") : ""}</span><input id="f-coll" type="text" value="${esc((d.collections || []).join(", "))}" placeholder="Weeknight wins, Date night"></label>
      <label for="f-ing">Ingredients<span class="hint">One per line. Start a line with ## to make a section, like ## Sauce</span><textarea id="f-ing" style="min-height:160px">${esc((d.ingredients || []).join("\n"))}</textarea></label>
      <label for="f-steps">Steps<span class="hint">One per line, numbers added for you. ## works here too.</span><textarea id="f-steps" style="min-height:160px">${esc((d.steps || []).join("\n"))}</textarea></label>
      <label for="f-notes">Notes<textarea id="f-notes" style="min-height:70px">${esc(d.notes || "")}</textarea></label>
      <label style="flex-direction:row;display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="f-want" ${d.want ? "checked" : ""} style="width:20px;height:20px;accent-color:var(--herb)"> Add to Want to make</label>
      <div class="row">
        <button class="btn primary" type="submit">Save recipe</button>
        <button class="btn ghost" type="button" data-act="${ctx === "draft" ? "draft-cancel" : "edit-cancel"}">Cancel</button>
      </div>
    </form>`;
  }

  const driveUrl = (id) => "https://drive.google.com/thumbnail?id=" + encodeURIComponent(id) + "&sz=w1200";

  async function addPhotoToRecipe(file) {
    const r = getRecipe(S.openId); if (!r || S.uploading) return;
    S.uploading = true; renderSheet();
    try {
      const id = await uploadPhoto(await shrink(file));
      S.uploading = false;
      if (!id) { renderSheet(); return; }
      const fresh = getRecipe(r.id) || r;
      const had = photosOf(fresh).length;
      const images = had ? [...(fresh.images || []), driveUrl(id)] : [driveUrl(id), ...(fresh.images || [])];
      await write(() => Data.update(r.id, { images }), had ? "Photo added. Tap Edit to make it the cover." : "Photo added as the cover.");
    } catch (e) { S.uploading = false; toast((e && e.message) || "Couldn't add that photo."); renderSheet(); }
  }

  async function addPhotoToForm(file) {
    if (S.uploading) return;
    S.uploading = true; toast("Adding photo…");
    try {
      const id = await uploadPhoto(await shrink(file));
      if (id) { S.formImages.push(driveUrl(id)); const box = $("#formPhotos"); if (box) box.innerHTML = formPhotosHTML(); toast("Photo added."); }
    } catch (e) { toast((e && e.message) || "Couldn't add that photo."); }
    S.uploading = false;
  }

  // One place for every way a photo arrives: pasted, dropped, or picked.
  async function handleImageFile(file) {
    if (!file || !S.canWrite) return;
    if (S.openId && !S.editing) return addPhotoToRecipe(file);
    if ((S.openId && S.editing) || S.draft) return addPhotoToForm(file);
    if (S.view === "add") {
      let blob;
      try { blob = await shrink(file); } catch (e) { toast(e.message || "Couldn't read that image."); return; }
      if (S.addMode === "paste" && S.paste.trim()) {
        if (S.pendingUrl) URL.revokeObjectURL(S.pendingUrl);
        S.pendingPhoto = blob; S.pendingUrl = URL.createObjectURL(blob);
        const c = $("#pasteCtl"); if (c) c.innerHTML = pasteControls();
        toast("Photo attached. It'll be the cover.");
      } else {
        if (S.photoUrl) URL.revokeObjectURL(S.photoUrl);
        S.addMode = "photo"; S.photo = blob; S.photoUrl = URL.createObjectURL(blob); S.err = ""; render();
      }
      return;
    }
    toast("Open a recipe first, then paste the photo into it.");
  }

  // A pasted photo *address* (some sites copy the link instead of the picture) counts as a photo too.
  function looksLikeImageUrl(t) {
    t = (t || "").trim();
    if (!/^https:\/\/\S+$/i.test(t)) return false;
    return /\.(jpe?g|png|webp|avif)(\?|#|$)/i.test(t) || /\/thmb\/|wp-content\/uploads|cloudinary|imgix|\/images?\//i.test(t);
  }

  async function handleImageUrl(u) {
    if (!S.canWrite) return;
    u = u.trim();
    // Keep a real copy in Drive when the site allows it; otherwise show it from the site.
    toast("Adding photo…");
    try { const r = await api("savePhotoUrl", { url: u }); if (r && r.id) u = driveUrl(r.id); } catch (e) { /* fall back to the link */ }
    if (S.openId && !S.editing) {
      const r = getRecipe(S.openId); if (!r) return;
      const had = photosOf(r).length;
      const images = had ? [...(r.images || []), u] : [u, ...(r.images || [])];
      S.badImg.delete(u);
      await write(() => Data.update(r.id, { images }), had ? "Photo added. Tap Edit to make it the cover." : "Photo added as the cover.");
      return;
    }
    if ((S.openId && S.editing) || S.draft) { S.formImages.push(u); const box = $("#formPhotos"); if (box) box.innerHTML = formPhotosHTML(); toast("Photo added."); return; }
    if (S.view === "add") {
      if (S.pendingUrl && S.pendingPhoto) URL.revokeObjectURL(S.pendingUrl);
      S.pendingPhoto = null; S.pendingUrl = u;
      const c = $("#pasteCtl"); if (c) c.innerHTML = pasteControls();
      toast(S.paste.trim() ? "Photo attached. It'll be the cover." : "Photo attached. Now paste the recipe text or link.");
      return;
    }
    toast("Open a recipe first, then paste the photo into it.");
  }

  function pasteTargetHTML(label) {
    return `<div class="paste-target" id="pasteTarget" contenteditable="true" role="textbox" aria-label="${esc(label)}" data-label="${esc(label)}"></div>`;
  }

  // Turn the API's technical "site blocks our reader" error into plain words.
  function friendly(msg) {
    if (/not accessible to our user agent|url_not_accessible|robots/i.test(msg || "")) return "This site blocks apps from reading its recipes. Copy the recipe text and paste it in with the link, or take a screenshot of the recipe and use Screenshot or photo.";
    return msg;
  }

  function formPhotosHTML() {
    const add = `<div class="row"><label class="btn" for="formPhotoIn" style="font-weight:700">Add a photo</label><input id="formPhotoIn" type="file" accept="image/*" hidden>${pasteTargetHTML("Paste a photo")}</div>`;
    if (!S.formImages.length) return add;
    return `<div class="grid-gap" style="gap:6px"><b style="font-size:.9rem">Photos from the page</b><span class="note">The first photo is the cover. Tap a photo to make it the cover, or × to remove it.</span>
      <div class="form-photos">${S.formImages.map((u, i) => `<div class="ph"${i === 0 ? ' style="outline:3px solid var(--accent);outline-offset:-3px"' : ""}><span data-cover="${i}" style="display:block;width:100%;height:100%;cursor:pointer">${imgTag(u, "")}</span><button type="button" data-rmimg="${i}" aria-label="Remove photo ${i + 1}">×</button></div>`).join("")}</div>${add}</div>`;
  }

  function readForm() {
    const lines = (id) => $(id).value.split("\n").map((s) => s.replace(/^\s*(?:[-•*]|\d+[.)])\s*/, "").trim()).filter(Boolean);
    return {
      title: $("#f-title").value.trim() || "Untitled recipe",
      sourceUrl: cleanUrl($("#f-url").value.trim()),
      summary: $("#f-sum").value.trim(),
      credit: $("#f-credit").value.trim(),
      time: $("#f-time").value.trim(),
      servings: $("#f-serv").value.trim(),
      tags: [...new Set($("#f-tags").value.split(",").map((t) => t.trim().toLowerCase().replace(/^#/, "")).filter(Boolean))],
      ingredients: lines("#f-ing"),
      steps: lines("#f-steps"),
      notes: $("#f-notes").value.trim(),
      want: $("#f-want").checked,
      images: S.formImages.slice(),
      collections: [...new Set($("#f-coll").value.split(",").map((t) => t.trim()).filter(Boolean))].slice(0, 12),
    };
  }

  // ---------- detail sheet ----------
  function scaleBarHTML(r) {
    const base = baseServings(r);
    const shown = base ? Math.round(base * S.scale * 10) / 10 : 0;
    return `<div class="scalebar">
      ${base ? `<div class="stepper" role="group" aria-label="Servings"><button data-serv="-1" aria-label="Fewer servings" ${shown <= 1 ? "disabled" : ""}>−</button><span>Serves <b>${esc(fmtNum(shown) || shown)}</b></span><button data-serv="1" aria-label="More servings">+</button></div>`
        : `<div class="seg mini" role="group" aria-label="Scale">${[[0.5, "½×"], [1, "1×"], [2, "2×"], [3, "3×"]].map(([f, l]) => `<button data-scale="${f}" aria-pressed="${S.scale === f}">${l}</button>`).join("")}</div>`}
      <div class="seg mini" role="group" aria-label="Units">${[["orig", "As written"], ["us", "US"], ["metric", "Metric"]].map(([u, l]) => `<button data-units="${u}" aria-pressed="${S.units === u}">${l}</button>`).join("")}</div>
    </div>`;
  }

  function journalHTML() {
    if (!S.comments.length) return `<p class="note" style="margin:0 0 8px">How did it turn out? Tap <b>We made this</b>, or leave a note for next time.</p>`;
    return S.comments.slice().reverse().map((c) => {
      const who = esc(c.by === S.me ? "You" : firstName(c.by));
      if (c.kind === "made") return `<div class="comment made"><span class="avatar" aria-hidden="true">${esc(initials(c.by))}</span><div>
        <b>${who}</b> cooked it ${c.rating ? `<span class="stars">${"★".repeat(c.rating)}${"☆".repeat(5 - c.rating)}</span>` : ""} <span class="when">${esc(new Date(c.createdAt).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }))}</span>
        ${c.text ? `<div style="white-space:pre-wrap">${esc(c.text)}</div>` : ""}
        ${c.photo && !S.badImg.has(c.photo) ? `<a class="jphoto" href="${esc(c.photo)}" target="_blank" rel="noopener">${imgTag(c.photo, "How it turned out")}</a>` : ""}</div></div>`;
      if (c.kind === "ask") return `<div class="comment ask"><span class="avatar" aria-hidden="true">${esc(initials(c.by))}</span><div>
        <details><summary><b>${who}</b> asked: ${esc(c.question || "a question")} <span class="when">${esc(ago(c.createdAt))}</span></summary><div class="answer">${esc(c.text)}</div></details></div></div>`;
      return `<div class="comment"><span class="avatar" aria-hidden="true">${esc(initials(c.by))}</span><div><b>${who}</b> <span class="when">${esc(ago(c.createdAt))}</span><div style="white-space:pre-wrap">${esc(c.text)}</div></div></div>`;
    }).join("");
  }

  function madePanelHTML() {
    return `<div class="block made-panel"><h3>How did it go?</h3>
      <div class="star-btns big" role="group" aria-label="Your rating">${[1, 2, 3, 4, 5].map((n) => `<button class="${n <= S.madeRating ? "on" : ""}" data-made-rate="${n}" aria-label="${n} star${n > 1 ? "s" : ""}">★</button>`).join("")}</div>
      <label for="madeNote">Notes for next time<textarea id="madeNote" style="min-height:70px" placeholder="Doubled the garlic, 5 more minutes in the oven…"></textarea></label>
      <div class="row">${S.madePhoto ? `<img src="${esc(S.madePhoto)}" referrerpolicy="no-referrer" alt="Your photo" style="width:64px;height:64px;object-fit:cover;border-radius:10px">` : ""}
        <label class="btn" for="madePhotoIn">${S.uploading ? "Uploading…" : S.madePhoto ? "Change photo" : "Add your photo"}</label><input id="madePhotoIn" type="file" accept="image/*" hidden></div>
      <div class="row"><button class="btn primary" data-act="made-save" ${S.uploading ? "disabled" : ""}>Save to journal</button><button class="btn ghost" data-act="made-cancel">Cancel</button></div></div>`;
  }

  function planForHTML(r) {
    const days = [...Array(10)].map((_, i) => ymd(new Date(Date.now() + i * 864e5)));
    return `<div class="block"><h3>Plan it for…</h3><div class="row">${days.map((d) => `<button class="chip big" data-plan-on="${d}">${esc(dayLabel(d))}</button>`).join("")}</div>
      <button class="linkish" data-act="plan-for-close">Cancel</button></div>`;
  }

  function nutritionHTML(r) {
    const n = r.nutrition;
    if (n) return `<div class="block"><h3>Nutrition <span class="count">per serving${n.servings ? `, serves ${esc(fmtNum(n.servings) || n.servings)}` : ""}</span></h3>
      <div class="nut">${[["Calories", n.calories, ""], ["Protein", n.protein, "g"], ["Carbs", n.carbs, "g"], ["Fat", n.fat, "g"], ["Fiber", n.fiber, "g"], ["Sodium", n.sodium, "mg"]].filter((x) => x[1] != null && x[1] !== 0 || x[0] === "Calories").map(([l, v, u]) => `<div><b>${esc(String(v))}${u}</b><span>${l}</span></div>`).join("")}</div>
      <p class="note" style="margin:6px 0 0">Estimate${n.note ? ": " + esc(n.note) : ""}. ${S.canAI && S.canWrite ? `<button class="linkish" data-act="nutrition">Re-estimate</button>` : ""}</p></div>`;
    if (!S.canAI || !S.canWrite || !(r.ingredients || []).length) return "";
    return `<div class="block"><h3>Nutrition</h3><button class="btn" data-act="nutrition" ${S.nutBusy ? "disabled" : ""}>${S.nutBusy ? "Estimating…" : "Estimate calories and protein"}</button></div>`;
  }

  function askHTML(r) {
    if (!S.canAI) return "";
    const ideas = ["Can I make this dairy-free?", "What can I swap for an ingredient I'm missing?", "How do I make this in the Instant Pot?", "Can I make it ahead?"];
    return `<div class="block ask-block"><h3>Ask about this recipe</h3>
      <form id="askForm" class="search"><input id="askQ" type="text" value="${esc(S.askQ)}" placeholder="What can I use instead of shallots?" aria-label="Your question" autocomplete="off"><button class="btn herb" type="submit" ${S.askBusy ? "disabled" : ""}>${S.askBusy ? "Thinking…" : "Ask"}</button></form>
      ${S.askAnswer ? `<div class="answer-box"><b>${esc(S.askAnswer.q)}</b><div class="answer">${esc(S.askAnswer.a)}</div>
        <div class="row"><button class="btn small" data-act="ask-save">Save to journal</button><button class="btn small ghost" data-act="ask-clear">Clear</button></div></div>`
        : `<div class="row ask-ideas">${ideas.map((q) => `<button class="chip" data-ask="${esc(q)}">${esc(q)}</button>`).join("")}</div>`}</div>`;
  }

  function renderSheet() {
    const host = $("#sheet");
    const r = S.openId && getRecipe(S.openId);
    if (!r) { host.innerHTML = ""; document.body.style.overflow = ""; return; }
    document.body.style.overflow = "hidden";
    const keepInput = document.activeElement && document.activeElement.id === "askQ";
    const prevScroll = $(".sheet", host) ? $(".sheet", host).scrollTop : 0;
    const photos = photosOf(r);
    if (S.heroIdx >= photos.length) S.heroIdx = 0;
    const img = photos[S.heroIdx] || "";
    const people = [...new Set([S.me, ...Object.keys(r.ratings || {})].filter(Boolean))];
    let body;
    if (S.editing) {
      body = `<div class="inner"><h2>Edit recipe</h2>${editForm(r, "edit")}</div>`;
    } else {
      const src = r.sourceUrl ? `<a class="source-link" href="${esc(r.sourceUrl)}" target="_blank" rel="noopener">Open on ${esc(sourceOf(r.sourceUrl) || "source")} ↗</a>` : "";
      const hasSteps = (r.steps || []).length > 0;
      body = `${img ? `<a class="hero" href="${esc(img)}" target="_blank" rel="noopener" aria-label="Open full-size photo">${imgTag(img, r.title, true)}</a>` : ""}
      ${photos.length > 1 ? `<div class="gallery" role="group" aria-label="More photos">${photos.map((u, i) => `<button data-hero="${i}" aria-pressed="${i === S.heroIdx}" aria-label="Photo ${i + 1}">${imgTag(u, "")}</button>`).join("")}</div>` : ""}
      <div class="inner">
        <div class="grid-gap" style="gap:8px">
          <div class="row">${(r.collections || []).map((c) => `<span class="pill coll">${esc(c)}</span>`).join("")}${(r.tags || []).map((t) => `<span class="pill">${esc(t)}</span>`).join("")}</div>
          <h2>${esc(r.title)}</h2>
          ${r.summary ? `<p style="margin:0;color:var(--muted)">${esc(r.summary)}</p>` : ""}
          <div class="meta">
            <span class="who"><span class="avatar" aria-hidden="true">${esc(initials(r.addedBy))}</span>Added by ${esc(firstName(r.addedBy))} · ${esc(ago(r.createdAt))}</span>
            ${r.credit ? `<span>Recipe by ${esc(r.credit)}</span>` : ""}
            ${r.time ? `<span>${esc(r.time)}</span>` : ""}${r.servings ? `<span>Serves ${esc(r.servings)}</span>` : ""}
            ${r.madeCount ? `<span>Made ${r.madeCount}× · last ${esc(ago(r.lastMade))}</span>` : ""}
          </div>
          ${src}
          ${!photos.length && r.sourceUrl && S.canWrite && !/instagram|tiktok|facebook/i.test(r.sourceUrl) ? `<button class="btn" data-act="get-photos" style="justify-self:start" ${S.busy ? "disabled" : ""}>${S.busy ? "Getting photos…" : "Add photos from the blog"}</button>` : ""}
        </div>
        ${S.canWrite ? `<div class="row main-actions">
          ${hasSteps ? `<button class="btn primary big" data-act="cook">Start cooking</button>` : ""}
          <button class="btn herb big" data-act="made">We made this</button>
        </div>
        <div class="row sub-actions">
          <button class="btn small ${r.want ? "primary" : ""}" data-act="toggle-want" aria-pressed="${!!r.want}">${r.want ? "★ Want to make" : "☆ Want to make"}</button>
          <button class="btn small" data-act="plan-for">Plan it</button>
          ${(r.ingredients || []).length ? `<button class="btn small" data-act="to-grocery">Add to groceries</button>` : ""}
          <button class="btn small" data-act="share">Share</button>
          <label class="btn small" for="addPhotoIn">${S.uploading ? "Uploading…" : "Add a photo"}</label>
          <input id="addPhotoIn" type="file" accept="image/*" hidden ${S.uploading ? "disabled" : ""}>
          ${pasteTargetHTML("Paste a photo")}
        </div>` : ""}
        ${S.madeOpen ? madePanelHTML() : ""}
        ${S.planFor ? planForHTML(r) : ""}
        ${needsDetails(r) ? `<div class="block"><h3>Needs details</h3><p class="note" style="margin:0 0 10px">Saved without ingredients or steps. Paste the caption or recipe to fill it in.</p>
          ${S.canWrite ? `<textarea id="fillText" placeholder="Paste caption or recipe text…"></textarea>
          <div class="row" style="margin-top:8px">${S.canAI && r.sourceUrl ? `<button class="btn primary" data-act="fill-link" ${S.busy ? "disabled" : ""}>Read from link</button>` : ""}${S.canAI ? `<button class="btn ${r.sourceUrl ? "" : "primary"}" data-act="fill-extract" ${S.busy ? "disabled" : ""}>Read pasted text</button>` : ""}<button class="btn" data-act="edit">Fill in by hand</button></div>
          ${S.busy ? `<span class="working"><span class="spin"></span>Reading…</span>` : ""}${S.err ? `<div class="error">${esc(S.err)}</div>` : ""}` : ""}</div>` : ""}
        ${(r.ingredients || []).length ? `<div class="block"><h3>Ingredients <span class="count">${r.ingredients.filter((l) => !isHead(l)).length}</span></h3>
          ${scaleBarHTML(r)}
          ${groups(r.ingredients).map((g, gi) => `${g.name ? `<h4 class="sub">${esc(g.name)}</h4>` : ""}<ul class="ing">${g.items.map((i, ii) => { const k = "i" + gi + "-" + ii; return `<li><button class="tick${S.checks.has(k) ? " on" : ""}" data-check="${k}" aria-pressed="${S.checks.has(k)}">${esc(scaleLine(i, S.scale, S.units))}</button></li>`; }).join("")}</ul>`).join("")}
          ${S.scale !== 1 ? `<p class="note" style="margin:8px 0 0">Amounts are ${esc(fmtNum(S.scale))}×. Amounts mentioned inside the steps aren't changed.</p>` : ""}</div>` : ""}
        ${hasSteps ? `<div class="block"><h3>Steps</h3>
          ${(() => { let n = 0; return groups(r.steps).map((g, gi) => `${g.name ? `<h4 class="sub">${esc(g.name)}</h4>` : ""}<ol class="steps">${g.items.map((st, si) => { n++; const k = "s" + gi + "-" + si; const ts = timesIn(st);
            return `<li><button class="tick step${S.checks.has(k) ? " on" : ""}" data-check="${k}" aria-pressed="${S.checks.has(k)}"><span class="num">${n}</span><span>${cue(esc(convertTemps(st, S.units)))}</span></button>
              ${ts.length ? `<div class="step-timers">${ts.map((t) => `<button class="tbtn" data-timer="${t.secs}" data-tlabel="${esc(t.label)}">⏱ ${esc(t.label)}</button>`).join("")}</div>` : ""}</li>`; }).join("")}</ol>`).join(""); })()}</div>` : ""}
        ${r.notes ? `<div class="block"><h3>Tips</h3><ul class="ing">${r.notes.split("\n").map((l) => l.replace(/^\s*[-•*]\s*/, "").trim()).filter(Boolean).map((l) => `<li>${esc(l)}</li>`).join("")}</ul></div>` : ""}
        ${nutritionHTML(r)}
        ${askHTML(r)}
        ${r.rawText ? `<details class="block raw"><summary>Original post</summary><div style="white-space:pre-wrap;margin-top:8px">${esc(r.rawText)}</div>
          ${S.canWrite && S.canAI ? `<div class="row" style="margin-top:10px"><button class="btn" data-act="reclean" ${S.busy ? "disabled" : ""}>Organize again from this</button>${S.busy ? `<span class="working"><span class="spin"></span>Organizing…</span>` : ""}</div>` : ""}</details>` : ""}
        <div class="block"><h3>Ratings</h3>
          ${people.length ? people.map((p) => {
            const v = (r.ratings || {})[p] || 0;
            const mine = p === S.me && S.canWrite;
            return `<div class="rate-row"><span class="who"><span class="avatar" aria-hidden="true">${esc(initials(p))}</span>${esc(p === S.me ? "You" : firstName(p))}</span>
              ${mine ? `<span class="star-btns" role="group" aria-label="Your rating">${[1, 2, 3, 4, 5].map((n) => `<button class="${n <= v ? "on" : ""}" data-rate="${n}" aria-label="${n} star${n > 1 ? "s" : ""}">★</button>`).join("")}</span>`
                     : `<span class="stars">${v ? starStr(v) : '<span class="note">Not rated</span>'}</span>`}</div>`;
          }).join("") : `<p class="note" style="margin:0">No ratings yet.</p>`}
        </div>
        <div class="block"><h3>Kitchen journal</h3>
          ${journalHTML()}
          ${S.canWrite ? `<form class="search" id="cAdd" style="margin-top:8px"><input id="cText" type="text" placeholder="Leave a note…" aria-label="Add a note"><button class="btn herb" type="submit">Post</button></form>` : ""}
        </div>
        ${S.canWrite ? `<div class="row"><button class="btn" data-act="edit">Edit</button><button class="btn ghost danger" data-act="delete">${S.deleteArm === r.id ? "Tap again to delete" : "Delete recipe"}</button></div>` : ""}
      </div>`;
    }
    host.innerHTML = `<div class="sheet-wrap" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(r.title)}">
      <div class="sheet-top"><span></span><button class="btn" data-act="close">Close</button></div>${body}</div></div>`;
    $(".sheet", host).scrollTop = prevScroll;
    if (keepInput) { const q = $("#askQ"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
  }

  function openRecipe(id) {
    closeRecipe(true);
    S.openId = id; S.heroIdx = 0; S.formKey = null; S.editing = false; S.comments = []; S.err = ""; S.deleteArm = false; S.checks = new Set();
    S.scale = 1; S.madeOpen = false; S.madeRating = 0; S.madePhoto = ""; S.askQ = ""; S.askAnswer = null; S.planFor = false;
    syncComments();
    renderSheet();
  }
  function closeRecipe(silent) {
    S.openId = null; S.editing = false; S.comments = []; S.deleteArm = false;

  // ---------- actions ----------
  async function saveNew(data, extra = {}) {
    const t = now();
    const doc = {
      title: data.title, summary: data.summary || "", credit: data.credit || "", sourceUrl: data.sourceUrl || "", sourceType: extra.sourceType || (data.sourceUrl ? "link" : "text"),
      ingredients: data.ingredients || [], steps: data.steps || [], tags: data.tags || [],
      time: data.time || "", servings: data.servings || "", notes: data.notes || "",
      imageId: extra.imageId || null, images: data.images || [], rawText: (extra.rawText || "").slice(0, 20000),
      want: !!data.want, wantAt: data.want ? t : null, madeCount: 0, lastMade: null,
      ratings: {}, addedBy: S.me || null, createdAt: t, updatedAt: t, collections: data.collections || [],
    };
    let saved = null;
    const ok = await write(async () => { saved = await Data.save(doc); }, "Saved");
    return ok && saved ? saved.id : null;
  }

  async function addToGrocery(recipes, factor = 1) {
    const have = new Set(S.grocery.filter((g) => !g.done).map((g) => (g.recipeId || "") + "|" + g.text));
    const items = [];
    for (const r of recipes) {
      for (const line of (r.ingredients || []).filter((l) => !isHead(l))) {
        if (have.has(r.id + "|" + line)) continue;
        have.add(r.id + "|" + line);
        items.push({ text: factor === 1 ? line : scaleLine(line, factor, "orig"), recipeId: r.id, recipeTitle: r.title, by: S.me });
      }
    }
    if (!items.length) { toast("Those are already on the list"); return; }
    const k = items.length;
    await write(() => Data.groceryAdd(items), `Added ${k} item${k > 1 ? "s" : ""} to groceries`);
  }

  function resetAdd() { S.draft = null; S.photo = null; if (S.photoUrl) URL.revokeObjectURL(S.photoUrl); S.photoUrl = null; S.paste = ""; S.err = ""; S.formKey = null; if (S.pendingPhoto && S.pendingUrl) URL.revokeObjectURL(S.pendingUrl); S.pendingPhoto = null; S.pendingUrl = null; S.dupOk = false; }

  function pasteExtract() {
    const { url, rest } = splitPaste(S.paste);
    if (!rest && !url) { S.err = "Paste a link or some recipe text first."; render(); return; }
    runExtract(rest, null, { sourceUrl: url, title: "", _sourceType: url ? "link" : "text", _raw: rest });
  }

  function patchFromExtract(r, x, raw, replace) {
    const patch = { updatedAt: now(), rawText: raw.slice(0, 20000) };
    ["ingredients", "steps", "time", "servings", "summary", "credit"].forEach((k) => { if (x[k] && x[k].length) patch[k] = x[k]; });
    if (x.tags.length) patch.tags = replace ? x.tags : [...new Set([...(r.tags || []), ...x.tags])];
    if (x.notes) patch.notes = replace ? x.notes : [r.notes, x.notes].filter(Boolean).join("\n");
    if (x.title && /^(saved|untitled)/i.test(r.title || "untitled")) patch.title = x.title;
    if (x.images && x.images.length && (replace || !(r.images || []).length)) patch.images = x.images;
    return patch;
  }

  async function runExtract(material, images, base) {
    S.busy = true; S.err = ""; render();
    try {
      const x = await extract(material, images, base.sourceUrl);
      S.busy = false;
      if (!x.isRecipe && !x.ingredients.length) {
        S.draft = { ...base, title: base.title || "", _warn: "Couldn't find a recipe in that. Fill in what you can, or save it as is." };
      } else {
        S.draft = { ...base, ...x, title: x.title || base.title || "", sourceUrl: base.sourceUrl || "" };
      }
    } catch (e) {
      S.busy = false;
      if (e && e.code === "no_ai") { S.canAI = false; S.err = "Automatic organizing isn't set up yet. Fill in by hand instead."; }
      else if (e && e.message && e.code !== "network") S.err = friendly(e.message);
      else if (e && e.code === "rate_limited") S.err = "Too many requests just now. Wait a minute and try again.";
      else S.err = "Couldn't read that recipe. Try again, or fill it in by hand.";
    }
    render();
  }

  document.addEventListener("click", async (ev) => {
    const t = ev.target.closest("[data-open],[data-act],[data-tag],[data-mode],[data-rate],[data-gdel],[data-check],[data-pick],[data-hero],[data-rmimg],[data-cover],[data-coll],[data-week],[data-plan-add],[data-plan-choose],[data-plan-del],[data-plan-on],[data-serv],[data-scale],[data-units],[data-gview],[data-gdel-many],[data-timer],[data-tstop],[data-made-rate],[data-ask],[data-copy]");
    if (!t) return;
    const d = t.dataset;
    if (d.timer) { const rr = getRecipe((S.cook && S.cook.id) || S.openId); startTimer(+d.timer, d.tlabel || fmtClock(+d.timer), rr ? rr.title : ""); return; }
    if (d.tstop) { S.timers = S.timers.filter((x) => x.id !== d.tstop); renderTimers(); if (S.cook) renderCook(); return; }
    if (d.coll) { S.coll = S.coll === d.coll ? null : d.coll; S.tag = null; render(); return; }
    if (d.week) { S.weekOffset += +d.week; S.planPick = null; render(); return; }
    if (d.planAdd) { S.planPick = S.planPick === d.planAdd ? null : d.planAdd; S.planQ = ""; render(); setTimeout(() => { const q = $("#planQ"); if (q) q.focus(); }, 30); return; }
    if (d.planChoose) { const day = S.planPick; S.planPick = null; await write(() => Data.planAdd(day, d.planChoose), "Planned for " + dayLabel(day)); return; }
    if (d.planDel) { await write(() => Data.planDelete([d.planDel])); return; }
    if (d.planOn) { const rr = getRecipe(S.openId); S.planFor = false; if (rr) await write(() => Data.planAdd(d.planOn, rr.id), "Planned for " + dayLabel(d.planOn)); renderSheet(); return; }
    if (d.serv) { const rr = getRecipe(S.openId); const base = rr ? baseServings(rr) : 0; if (base) { const shown = Math.max(1, Math.round(base * S.scale) + +d.serv); S.scale = shown / base; } renderSheet(); return; }
    if (d.scale) { S.scale = +d.scale; renderSheet(); return; }
    if (d.units) { S.units = d.units; LS.set("units", d.units); renderSheet(); if (S.cook) renderCook(); return; }
    if (d.gview) { S.gView = d.gview; LS.set("gview", d.gview); render(); return; }
    if (d.gdelMany) { await write(() => Data.groceryDelete(d.gdelMany.split(","))); return; }
    if (d.madeRate) { S.madeRating = S.madeRating === +d.madeRate ? 0 : +d.madeRate; renderSheet(); return; }
    if (d.ask) { S.askQ = d.ask; renderSheet(); const q = $("#askQ"); if (q) { q.focus(); q.select(); } return; }
    if (d.copy) { const el = document.getElementById(d.copy); try { await navigator.clipboard.writeText(el.textContent); toast("Copied"); } catch { toast("Couldn't copy. Press and hold to select it instead."); } return; }
    if (t.dataset.hero) { S.heroIdx = +t.dataset.hero; renderSheet(); return; }
    if (t.dataset.cover) { const i = +t.dataset.cover; const [u] = S.formImages.splice(i, 1); S.formImages.unshift(u); $("#formPhotos").innerHTML = formPhotosHTML(); return; }
    if (t.dataset.rmimg) { S.formImages.splice(+t.dataset.rmimg, 1); $("#formPhotos").innerHTML = formPhotosHTML(); return; }
    if (t.dataset.pick) { $("#g-name").value = t.dataset.pick; return; }
    if (t.dataset.check) { const k = t.dataset.check; S.checks.has(k) ? S.checks.delete(k) : S.checks.add(k); if (S.cook) renderCook(); else renderSheet(); return; }
    if (t.dataset.open) { openRecipe(t.dataset.open); return; }
    if ("tag" in t.dataset) { S.tag = t.dataset.tag || null; if (!S.tag) S.coll = null; if (S.tag === t.dataset.tag && t.getAttribute("aria-pressed") === "true") S.tag = null; render(); return; }
    if (t.dataset.mode) { S.addMode = t.dataset.mode; S.err = ""; render(); return; }
    const r = S.openId && getRecipe(S.openId);
    if (t.dataset.rate && r) {
      const n = +t.dataset.rate; const cur = (r.ratings || {})[S.me] || 0;
      await write(() => Data.update(r.id, { ratings: { [S.me]: cur === n ? 0 : n } }));
      return;
    }
    if (t.dataset.gdel) { const id = t.dataset.gdel; await write(() => Data.groceryDelete([id])); return; }

    const act = t.dataset.act;
    if (act === "close-bg" && ev.target !== t) return;
    switch (act) {
      case "close": case "close-bg": closeRecipe(); break;
      case "who": if (S.passcode && S.me) location.hash = "#settings"; break;
      case "settings-close": location.hash = "#feed"; break;
      case "gate-cancel": S.changeName = false; render(); break;
      case "lock": LS.del("passcode"); try { localStorage.removeItem("rf-cache"); } catch {} S.passcode = ""; S.changeName = false; S.recipes = []; S.grocery = []; S.allComments = []; S.plan = []; S.loaded = false; location.hash = "#feed"; render(); break;
      case "backup": downloadBackup(); break;
      case "act-more": S.actMore = !S.actMore; render(); break;
      case "pantry-open": S.pantryOpen = true; render(); setTimeout(() => { const i = $("#pantryIn"); if (i) i.focus(); }, 30); break;
      case "pantry-close": S.pantryOpen = false; render(); break;
      case "plan-pick-close": S.planPick = null; render(); break;
      case "plan-groceries": {
        const start = weekStart(S.weekOffset);
        const days = [...Array(7)].map((_, i) => { const x = new Date(start); x.setDate(start.getDate() + i); return ymd(x); });
        const ids = [...new Set(S.plan.filter((p) => days.includes(p.date)).map((p) => p.recipeId))];
        await addToGrocery(ids.map(getRecipe).filter(Boolean));
        break;
      }
      case "cook": openCook(); break;
      case "cook-close": closeCook(); break;
      case "cook-prev": if (S.cook) { S.cook.idx = Math.max(0, S.cook.idx - 1); S.cook.showIng = false; renderCook(); } break;
      case "cook-next": if (S.cook) { S.cook.idx += 1; S.cook.showIng = false; renderCook(); } break;
      case "cook-ing": if (S.cook) { S.cook.showIng = !S.cook.showIng; renderCook(); } break;
      case "cook-finish": closeCook(); S.madeOpen = true; renderSheet(); setTimeout(() => { const mp = $(".made-panel"); if (mp) mp.scrollIntoView({ block: "center" }); }, 50); break;
      case "made-cancel": S.madeOpen = false; S.madePhoto = ""; S.madeRating = 0; renderSheet(); break;
      case "made-save": {
        const note = ($("#madeNote") || {}).value || "";
        const rating = S.madeRating;
        const patch = { madeCount: (r.madeCount || 0) + 1, lastMade: now(), want: false };
        if (rating) patch.ratings = { [S.me]: rating };
        const ok = await write(async () => { await Data.comment(r.id, note.trim(), { kind: "made", rating, photo: S.madePhoto }); await Data.update(r.id, patch); }, "Saved to the journal");
        if (ok) { if (S.madePhoto && !(r.images || []).includes(S.madePhoto)) Data.update(r.id, { images: [...(getRecipe(r.id).images || []), S.madePhoto] }).catch(() => {}); S.madeOpen = false; S.madePhoto = ""; S.madeRating = 0; renderSheet(); }
        break;
      }
      case "plan-for": S.planFor = !S.planFor; renderSheet(); break;
      case "plan-for-close": S.planFor = false; renderSheet(); break;
      case "share": await shareRecipe(r); break;
      case "nutrition": {
        S.nutBusy = true; renderSheet();
        try { const upd = await api("nutrition", { id: r.id }); putRecipe(upd); }
        catch (e) { toast((e && e.message) || "Couldn't estimate nutrition."); }
        S.nutBusy = false; renderSheet();
        break;
      }
      case "ask-save": if (S.askAnswer) { const a = S.askAnswer; if (await write(() => Data.comment(r.id, a.a, { kind: "ask", question: a.q }), "Saved to the journal")) { S.askAnswer = null; S.askQ = ""; renderSheet(); } } break;
      case "ask-clear": S.askAnswer = null; S.askQ = ""; renderSheet(); break;
      case "toggle-want": await write(() => Data.update(r.id, { want: !r.want, wantAt: !r.want ? now() : null }), r.want ? "Removed from list" : "Added to Want to make"); break;
      case "made": S.madeOpen = !S.madeOpen; S.madeRating = (r.ratings || {})[S.me] || 0; S.planFor = false; renderSheet(); setTimeout(() => { const mp = $(".made-panel"); if (mp) mp.scrollIntoView({ block: "center", behavior: "smooth" }); }, 50); break;
      case "to-grocery": await addToGrocery([r], S.scale); break;
      case "edit": S.editing = true; S.formKey = null; renderSheet(); break;
      case "edit-cancel": S.editing = false; S.formKey = null; renderSheet(); break;
      case "delete":
        if (S.deleteArm !== r.id) { S.deleteArm = r.id; renderSheet(); setTimeout(() => { if (S.deleteArm === r.id) { S.deleteArm = false; renderSheet(); } }, 4000); break; }
        { const id = r.id; closeRecipe(); await write(() => Data.del(id), "Recipe deleted"); }
        break;
      case "drop-pending": if (S.pendingPhoto && S.pendingUrl) URL.revokeObjectURL(S.pendingUrl); S.pendingPhoto = null; S.pendingUrl = null; { const c = $("#pasteCtl"); if (c) c.innerHTML = pasteControls(); } break;
      case "get-photos": {
        S.busy = true; renderSheet();
        try {
          const res = await api("pagePhotos", { url: r.sourceUrl });
          S.busy = false;
          if (res.images && res.images.length) await write(() => Data.update(r.id, { images: res.images }), "Photos added. Tap Edit to drop any you don't want.");
          else { toast("Couldn't find photos on that page."); renderSheet(); }
        } catch (e) { S.busy = false; toast((e && e.message) || "Couldn't get photos."); renderSheet(); }
        break;
      }
      case "fill-link": {
        S.busy = true; S.err = ""; renderSheet();
        try {
          const x = await extract("", null, r.sourceUrl);
          S.busy = false;
          await write(() => Data.update(r.id, patchFromExtract(r, x, r.rawText || "", false)), "Filled in. Check it over.");
        } catch (e) { S.busy = false; S.err = friendly((e && e.message) || "Couldn't read that link."); renderSheet(); }
        break;
      }
      case "fill-extract": {
        const txt = $("#fillText").value.trim();
        if (!txt) { S.err = "Paste the caption or recipe first."; renderSheet(); break; }
        S.busy = true; S.err = ""; renderSheet();
        try {
          const sp = splitPaste(txt);
          const x = await extract(sp.rest, null, r.sourceUrl || sp.url);
          S.busy = false;
          const patch = patchFromExtract(r, x, sp.rest, false);
          if (sp.url && !r.sourceUrl) patch.sourceUrl = sp.url;
          await write(() => Data.update(r.id, patch), "Filled in. Check it over.");
        } catch (e) { S.busy = false; S.err = "Couldn't read that. Try again or fill in by hand."; renderSheet(); }
        break;
      }
      case "paste-quick": {
        const { url, rest } = splitPaste(S.paste);
        if (!url) break;
        const id = await saveNew({ title: titleFromUrl(url), sourceUrl: url }, { sourceType: "link", rawText: rest });
        if (id) { resetAdd(); location.hash = "#feed"; }
        break;
      }
      case "paste-extract": pasteExtract(); break;
      case "paste-manual": { const { url, rest } = splitPaste(S.paste); S.draft = { title: "", sourceUrl: url, notes: rest, _sourceType: url ? "link" : "text", _raw: rest }; render(); break; }
      case "reclean": {
        S.busy = true; renderSheet();
        try {
          const x = await extract(r.rawText, null, r.sourceUrl);
          S.busy = false; S.checks.clear();
          await write(() => Data.update(r.id, patchFromExtract(r, x, r.rawText, true)), "Reorganized");
        } catch { S.busy = false; toast("Couldn't organize that. Try again in a minute."); renderSheet(); }
        break;
      }
      case "photo-extract": if (S.photo) await runExtract("", [S.photo], { _sourceType: "photo" }); break;
      case "photo-manual": S.draft = { title: "", _sourceType: "photo" }; render(); break;
      case "draft-cancel": S.draft = null; S.formKey = null; render(); break;
      case "g-copy": {
        const txt = S.grocery.filter((g) => !g.done).map((g) => "• " + g.text).join("\n");
        try { await navigator.clipboard.writeText(txt); toast("List copied"); } catch { toast("Couldn't copy. Long-press to select the list instead."); }
        break;
      }
      case "g-clear-done": await write(() => Data.groceryDelete(S.grocery.filter((x) => x.done).map((g) => g.id))); break;
      case "g-clear-all":
        if (S.deleteArm !== "grocery") { S.deleteArm = "grocery"; render(); setTimeout(() => { if (S.deleteArm === "grocery") { S.deleteArm = false; render(); } }, 4000); break; }
        S.deleteArm = false;
        await write(() => Data.groceryDelete(S.grocery.map((g) => g.id)));
        break;
    }
  });

  document.addEventListener("input", (ev) => {

  // Paste a photo straight from a website (Copy Image, then paste) or drop one onto the page.
  document.addEventListener("paste", (ev) => {
    const items = [...((ev.clipboardData && ev.clipboardData.items) || [])];
    const img = items.find((i) => i.kind === "file" && /^image\//.test(i.type));
    const cd = ev.clipboardData;
    const txt = (cd && cd.getData("text/plain")) || "";
    // Safari often hands web pages only the photo's address (as a link or as HTML), not the picture.
    const uri = ((cd && cd.getData("text/uri-list")) || "").split(/\r?\n/).find((l) => /^https:\/\//i.test(l)) || "";
    const htmlSrc = (((cd && cd.getData("text/html")) || "").match(/<img[^>]+src=["'](https:[^"']+)["']/i) || [])[1] || "";
    const photoAddr = htmlSrc ? htmlSrc.replace(/&amp;/g, "&") : looksLikeImageUrl(uri) ? uri : looksLikeImageUrl(txt) ? txt.trim() : "";
    const tid = ev.target && ev.target.id;
    if (tid === "pasteTarget") {
      ev.preventDefault();
      if (img) handleImageFile(img.getAsFile());
      else if (photoAddr) handleImageUrl(photoAddr);
      else if (/^https:\/\/\S+$/i.test((uri || txt).trim())) handleImageUrl((uri || txt).trim());
      else toast("There's no photo on the clipboard. Right-click the photo and choose Copy Image, or take a screenshot with ⌘⇧⌃4.");
      return;
    }
    if (!img && htmlSrc && !txt.trim()) { ev.preventDefault(); handleImageUrl(photoAddr); return; }
    if (!img && looksLikeImageUrl(txt)) {
      // In a normal text field (title, notes…) a link is just text. Elsewhere, treat it as the photo.
      const editable = ev.target && (ev.target.isContentEditable || /^(INPUT|TEXTAREA)$/.test(ev.target.tagName));
      if (!editable || tid === "pasteBox") { ev.preventDefault(); handleImageUrl(txt); return; }
    }
    if (!img) return;
    // Pasting a whole recipe into the text box can carry an image along; keep the text in that case.
    if (ev.target && ev.target.id === "pasteBox" && items.some((i) => i.type === "text/plain")) return;
    ev.preventDefault();
    handleImageFile(img.getAsFile());
  }, true);
  document.addEventListener("input", (ev) => { if (ev.target && ev.target.id === "pasteTarget") ev.target.textContent = ""; });
  document.addEventListener("dragover", (ev) => { if ([...ev.dataTransfer.types].includes("Files")) ev.preventDefault(); });
  document.addEventListener("drop", (ev) => {
    const f = [...(ev.dataTransfer.files || [])].find((x) => /^image\//.test(x.type));
    if (!f) return;
    ev.preventDefault();
    handleImageFile(f);
  });

  // Paste a caption (with or without the link) and it gets organized right away.
  document.addEventListener("paste", (ev) => {
    if (ev.defaultPrevented || ev.target.id !== "pasteBox" || !S.canAI || S.busy) return;
    setTimeout(() => {
      S.paste = ev.target.value;
      const { url, rest } = splitPaste(S.paste);
      if (rest.length >= 40 || (url && rest.length < 15)) pasteExtract();
      else { const c = $("#pasteCtl"); if (c) c.innerHTML = pasteControls(); }
    }, 0);
  });

  document.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const f = ev.target;
    if (f.id === "gate") {
      const p = $("#g-pass"); const nm = $("#g-name").value.trim().slice(0, 40);
      if (!nm) return;
      S.gateErr = "";
      const changing = !p && S.view === "settings";
      if (p) { S.passcode = p.value.trim(); LS.set("passcode", S.passcode); }
      S.me = nm; LS.set("name", nm); S.changeName = false;
      if (changing) { toast("Name saved"); render(); return; }
      if (loadCache()) hideSplash();
      render(); load();
      return;
    }
    if (f.id === "askForm") {
      const r = getRecipe(S.openId); const q = ($("#askQ").value || "").trim();
      if (!r || !q || S.askBusy) return;
      S.askQ = q; S.askBusy = true; renderSheet();
      try { const res = await api("ask", { id: r.id, question: q }); S.askAnswer = { q, a: res.answer }; }
      catch (e) { toast((e && e.message) || "Couldn't get an answer. Try again."); }
      S.askBusy = false; renderSheet();
      return;
    }
    if (f.id === "gAdd") {
      const v = $("#gText").value.trim(); if (!v) return;
      if (await write(() => Data.groceryAdd([{ text: v, by: S.me }]))) { $("#gText").value = ""; $("#gText").focus(); }
    }
    if (f.id === "cAdd") {
      const v = $("#cText").value.trim(); const r = getRecipe(S.openId); if (!v || !r) return;
      await write(() => Data.comment(r.id, v));
    }
    if (f.id === "editForm") {
      const data = readForm();
      const btn = f.querySelector('button[type="submit"]'); btn.disabled = true;
      if (f.dataset.ctx === "draft") {
        const d = S.draft;
        const dup = findDuplicate(data);
        if (dup && !S.dupOk) {
          S.dupOk = true; btn.disabled = false;
          const w = $("#dupWarn");
          if (w) { w.hidden = false; w.innerHTML = `Looks like you already stashed <b>${esc(dup.title)}</b> (${esc(ago(dup.createdAt))}). <button type="button" class="linkish" data-open="${esc(dup.id)}">Open it</button> or tap <b>Save recipe</b> again to save another copy.`; w.scrollIntoView({ block: "center", behavior: "smooth" }); }
          return;
        }
        S.dupOk = false;
        let imageId = null;
        if (d._sourceType === "photo" && S.photo) imageId = await uploadPhoto(S.photo);
        if (S.pendingPhoto) { const pid = await uploadPhoto(S.pendingPhoto); if (pid) data.images = [driveUrl(pid), ...(data.images || [])]; }
        else if (S.pendingUrl && /^https:/.test(S.pendingUrl)) data.images = [S.pendingUrl, ...(data.images || [])];
        const id = await saveNew(data, { sourceType: d._sourceType, rawText: d._raw || "", imageId });
        if (id) { resetAdd(); location.hash = "#feed"; setTimeout(() => openRecipe(id), 50); }
        else btn.disabled = false;
      } else {
        const r = getRecipe(S.openId); if (!r) return;
        const was = !!r.want;
        const ok = await write(() => Data.update(r.id, { ...data, wantAt: data.want && !was ? now() : r.wantAt || null }), "Saved");
        if (ok) { S.editing = false; S.formKey = null; renderSheet(); } else btn.disabled = false;
      }
    }
  });

  // A blog photo that won't load gets dropped instead of leaving a broken image.
  document.addEventListener("error", (ev) => {
    const el = ev.target;
    if (!el || el.tagName !== "IMG" || !el.dataset.src || el.dataset.src.startsWith("blob:")) return;
    S.badImg.add(el.dataset.src);
    if (S.editing || S.draft) { const box = el.closest(".ph, .gallery button"); if (box) box.style.display = "none"; return; }
    clearTimeout(S._imgT); S._imgT = setTimeout(render, 150);
  }, true);

  document.addEventListener("keydown", (ev) => {
    if (S.cook) {
      if (ev.key === "ArrowRight") { const r = getRecipe(S.cook.id); if (r && S.cook.idx < cookSteps(r).length - 1) { S.cook.idx++; renderCook(); } }
      else if (ev.key === "ArrowLeft" && S.cook.idx > 0) { S.cook.idx--; renderCook(); }
      else if (ev.key === "Escape") closeCook();
      return;
    }
    if (ev.key === "Escape" && S.openId) closeRecipe();
  });

  function route() {
    let h = location.hash.replace("#", "");
    if (h === "want") h = "plan";
    S.view = VIEWS.includes(h) ? h : "feed";
    S.planPick = null;
    if (S.openId) closeRecipe(true);
    S.err = S.view === "add" ? S.err : "";
    S.deleteArm = false;
    render();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
  init();
})();
</script>
</body>
</html>
