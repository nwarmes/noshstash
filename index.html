<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nosh Stash</title>
<meta name="description" content="Our recipe stash: save, cook, plan and shop together.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nosh Stash">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121613" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: mobile-first single column, sticky top bar with search, bottom tab bar; recipe detail as a sheet. */
:root {
  --bg: #f3f5f1;
  --surface: #ffffff;
  --ink: #1b221d;
  --muted: #5f6b63;
  --line: #dfe4dc;
  --accent: #e3a20b;      /* saffron */
  --accent-ink: #231a00;
  --herb: #2f6446;        /* basil */
  --herb-soft: #e3eee6;
  --danger: #b3261e;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121613; --surface: #1b211d; --ink: #e8ede8; --muted: #9aa69e; --line: #2c352f;
    --accent: #f0b432; --accent-ink: #1d1500; --herb: #7cc39a; --herb-soft: #21332a; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121613; --surface: #1b211d; --ink: #e8ede8; --muted: #9aa69e; --line: #2c352f;
  --accent: #f0b432; --accent-ink: #1d1500; --herb: #7cc39a; --herb-soft: #21332a; --danger: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
img { max-width: 100%; display: block; }

.app { max-width: 720px; margin: 0 auto; min-height: 100%; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(12px + env(safe-area-inset-top)) 0 10px; display: grid; gap: 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
.brand h1 span { color: var(--herb); }
.status { font-size: .8rem; color: var(--muted); }
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; padding: 11px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 4px 11px; border-radius: 999px; font-size: .85rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--herb); border-color: var(--herb); color: var(--surface); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
nav.tabs .inner { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
nav.tabs a { text-decoration: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 6px 0; border-radius: 10px; font-size: .78rem; font-weight: 700; }
nav.tabs a svg { width: 22px; height: 22px; }
nav.tabs a[aria-current="page"] { color: var(--herb); background: var(--herb-soft); }
nav.tabs a.add { color: var(--accent-ink); background: var(--accent); }

.section-head { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 0 10px; gap: 12px; }
.section-head h2 { font-size: 1.25rem; }
.section-head .count { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }

.feed { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: grid; grid-template-columns: 1fr; text-align: left; padding: 0; width: 100%; }
.card.has-img { grid-template-columns: 112px 1fr; }
.card .thumb { background: var(--herb-soft); min-height: 112px; position: relative; overflow: hidden; }
.card .thumb img, .sheet .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card .body { padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.card h3 { font-size: 1.08rem; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--muted); font-size: .82rem; }
.pill { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--herb-soft); color: var(--herb); text-transform: uppercase; letter-spacing: .04em; }
.pill.want { background: var(--accent); color: var(--accent-ink); }
.pill.inbox { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.pill.example { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.stars { color: var(--accent); letter-spacing: 1px; font-size: .9rem; }
.avatar { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--herb); color: var(--surface); font-size: .7rem; font-weight: 700; flex: none; }
.who { display: inline-flex; align-items: center; gap: 6px; }

.empty { text-align: center; color: var(--muted); padding: 40px 16px; border: 1px dashed var(--line); border-radius: var(--radius); }
.empty strong { display: block; color: var(--ink); font-family: var(--display); font-size: 1.15rem; margin-bottom: 4px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 999px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.herb { background: var(--herb); border-color: var(--herb); color: var(--surface); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .55; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Add */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin-bottom: 14px; }
.seg button { border: 0; background: transparent; padding: 8px; border-radius: 999px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--herb); color: var(--surface); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
label { font-weight: 700; font-size: .9rem; display: grid; gap: 6px; }
label .hint { font-weight: 400; color: var(--muted); font-size: .82rem; }
input[type="text"], input[type="url"], input[type="password"], input[type="search"], textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
textarea { min-height: 110px; resize: vertical; }
.drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.drop img { max-height: 260px; border-radius: 10px; }
.note { font-size: .85rem; color: var(--muted); }
.error { color: var(--danger); font-size: .9rem; }
.working { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: .9rem; }
.spin { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--herb); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 10; background: rgba(10, 14, 11, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 720px; max-height: 94%; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 0 0 calc(24px + env(safe-area-inset-bottom)); }
.sheet .hero { height: 260px; position: relative; overflow: hidden; background-color: var(--herb-soft); display: block; }
.gallery { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 0; scrollbar-width: none; }
.gallery button { flex: none; width: 72px; height: 72px; padding: 0; border: 2px solid transparent; border-radius: 10px; overflow: hidden; background: var(--herb-soft); }
.gallery button[aria-pressed="true"] { border-color: var(--accent); }
.gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
label.btn { font-size: 1rem; display: inline-flex; cursor: pointer; }
.paste-target { min-width: 150px; min-height: 42px; padding: 10px 14px; border: 1.5px dashed var(--muted); border-radius: 999px; color: var(--muted); font-weight: 700; cursor: text; outline: none; caret-color: transparent; }
.paste-target:empty::before { content: attr(data-label); }
.paste-target:focus { border-color: var(--accent); }
.paste-target:focus:empty::before { content: "Now paste (⌘V or long-press › Paste)"; font-weight: 400; }
.form-photos { display: flex; gap: 8px; flex-wrap: wrap; }
.form-photos .ph { position: relative; width: 76px; height: 76px; border-radius: 10px; overflow: hidden; background: var(--herb-soft); }
.form-photos img { width: 100%; height: 100%; object-fit: cover; }
.form-photos button { position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; font-size: 15px; line-height: 1; padding: 0; }
.sheet .inner { padding: 16px; display: grid; gap: 16px; }
.sheet-top { position: sticky; top: 0; display: flex; justify-content: space-between; padding: 10px 12px; z-index: 2; pointer-events: none; }
.sheet-top .btn { pointer-events: auto; padding: 8px 14px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.sheet h2 { font-size: 1.6rem; }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.block h3 { font-size: 1rem; margin-bottom: 8px; }
.ing { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ing li { padding-left: 18px; position: relative; }
.ing li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.block h3 .count { color: var(--muted); font-family: var(--body); font-weight: 400; font-size: .85rem; margin-left: 4px; }
h4.sub { font-family: var(--body); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--herb); margin: 14px 0 6px; }
h4.sub:first-of-type { margin-top: 2px; }
.ing li:has(.tick) { padding-left: 0; }
.ing li:has(.tick)::before { display: none; }
.tick { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 4px 0; line-height: 1.45; }
.tick:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ing .tick::before { content: ""; flex: none; width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--accent); }
.ing .tick.on::before { background: var(--herb); border-color: var(--herb); box-shadow: inset 0 0 0 3px var(--surface); }
.tick.on { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.steps .tick { padding: 8px 0; font-size: 1.04rem; }
.steps li + li .tick { border-top: 1px solid var(--line); }
.steps .num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--herb-soft); color: var(--herb); display: grid; place-items: center; font-weight: 700; font-size: .9rem; font-variant-numeric: tabular-nums; }
.steps .tick.on .num { background: var(--herb); color: var(--surface); }
.steps b { color: var(--ink); background: var(--herb-soft); padding: 0 4px; border-radius: 4px; font-weight: 700; }
.steps .tick.on b { background: transparent; color: inherit; }
details.raw summary { cursor: pointer; font-weight: 700; color: var(--muted); }
.rate-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; }
.rate-row + .rate-row { border-top: 1px solid var(--line); }
.star-btns { display: flex; }
.star-btns button { border: 0; background: none; font-size: 1.5rem; line-height: 1; padding: 2px 3px; color: var(--line); }
.star-btns button.on { color: var(--accent); }
.comment { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 0; }
.comment + .comment { border-top: 1px solid var(--line); }
.comment .when { color: var(--muted); font-size: .78rem; }
.source-link { color: var(--herb); font-weight: 700; word-break: break-all; }

/* Grocery */
.g-group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
.g-group h3 { font-size: .95rem; color: var(--muted); font-family: var(--body); margin: 2px 0 4px; }
.g-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.g-item + .g-item { border-top: 1px solid var(--line); }
.g-item input { width: 22px; height: 22px; accent-color: var(--herb); flex: none; }
.g-item.done span { text-decoration: line-through; color: var(--muted); }
.g-item span { flex: 1; }
.g-item .x { border: 0; background: none; color: var(--muted); font-size: 1.2rem; padding: 0 4px; }
.grid-gap { display: grid; gap: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .9rem; z-index: 20; max-width: 90%; }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
/* ---- Nosh Stash additions ---- */
.btn.small { padding: 7px 12px; font-size: .88rem; }
.btn.big { padding: 13px 20px; font-size: 1.05rem; }
.linkish { border: 0; background: none; color: var(--herb); font-weight: 700; padding: 4px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.chip.coll { border-color: var(--accent); color: var(--ink); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.chip.coll[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.big { padding: 8px 14px; font-size: .92rem; color: var(--ink); }
.pill.coll { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--ink); }
.main-actions .btn { flex: 1 1 160px; }
.sub-actions { gap: 6px; }
.sub-actions .paste-target { min-height: 34px; padding: 6px 12px; font-size: .88rem; min-width: 120px; }
.warn { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); border: 1px solid var(--accent); border-radius: 12px; padding: 10px 12px; font-size: .92rem; }

/* activity */
.activity { margin-bottom: 4px; }
.act-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.act { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 10px 14px; }
.act + .act { border-top: 1px solid var(--line); }
.act-text { font-size: .92rem; min-width: 0; }
.act .when { color: var(--muted); font-size: .78rem; white-space: nowrap; }
.new { display: inline-block; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; background: var(--accent); color: var(--accent-ink); padding: 1px 6px; border-radius: 999px; vertical-align: 1px; }

/* what can I make */
.pantry { margin: 6px 0 10px; }
.pm { display: grid; gap: 2px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; }
.pm-meta { color: var(--muted); font-size: .85rem; }
.pm .ok { color: var(--herb); font-weight: 700; }

/* plan */
.week-nav { gap: 4px; align-items: center; }
.days { display: grid; gap: 8px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 6px; }
.day.today { border-color: var(--herb); box-shadow: inset 4px 0 0 var(--herb); }
.day.past { opacity: .7; }
.day-head { display: flex; justify-content: space-between; align-items: center; }
.day-name { font-weight: 700; }
.plan-item { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 10px; padding: 4px 4px 4px 6px; }
.plan-open { flex: 1; display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 2px; font-weight: 700; }
.pthumb { position: relative; width: 40px; height: 40px; border-radius: 8px; overflow: hidden; flex: none; background: var(--herb-soft); }
.pthumb img { width: 100%; height: 100%; object-fit: cover; }
.plan-item .x { border: 0; background: none; color: var(--muted); font-size: 1.2rem; padding: 4px 8px; }
.pick { display: grid; gap: 6px; padding-top: 4px; }
.pick input { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.pick-list { display: grid; gap: 4px; max-height: 260px; overflow-y: auto; }
.pick-list button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; }

/* groceries */
.g-src { display: block; color: var(--muted); font-size: .76rem; }

/* scaling */
.scalebar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin: 0 0 10px; }
.seg.mini { display: inline-grid; grid-auto-flow: column; grid-auto-columns: auto; margin: 0; padding: 3px; }
.seg.mini button { padding: 5px 10px; font-size: .82rem; }
.stepper { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.stepper button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--herb-soft); color: var(--herb); font-size: 1.2rem; font-weight: 700; line-height: 1; }
.stepper button:disabled { opacity: .4; }
.step-timers { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 0 6px 38px; }
.tbtn { border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-radius: 999px; padding: 4px 10px; font-size: .82rem; font-weight: 700; }

/* timers */
body.has-timers .toast { bottom: calc(132px + env(safe-area-inset-bottom)); }
#cook:not([hidden]) ~ .timer-bar { display: none !important; }
.timer-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 30; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 94%; }
.timer { display: flex; align-items: center; gap: 8px; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 6px 6px 6px 14px; box-shadow: 0 4px 14px rgba(0,0,0,.25); font-size: .88rem; }
.timer .t-clock { font-variant-numeric: tabular-nums; font-size: 1rem; }
.timer button { border: 0; border-radius: 999px; background: rgba(255,255,255,.18); color: inherit; padding: 4px 10px; font-weight: 700; }
.timer.done { background: var(--accent); color: var(--accent-ink); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.05); } }

/* cook mode */
#cook { position: fixed; inset: 0; z-index: 40; background: var(--bg); }
.cook { height: 100%; max-width: 760px; margin: 0 auto; display: grid; grid-template-rows: auto auto 1fr auto auto auto auto; gap: 14px; padding: calc(14px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom)); }
.cook-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.cook-title { font-family: var(--display); font-weight: 700; font-size: 1.15rem; }
.cook-count { color: var(--muted); font-size: .9rem; }
.cook-dots { display: flex; gap: 4px; }
.cook-dots span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.cook-dots span.past { background: var(--herb); opacity: .5; }
.cook-dots span.now { background: var(--herb); }
.cook-step { font-size: clamp(1.4rem, 5.2vw, 2.1rem); line-height: 1.35; align-self: center; font-weight: 700; overflow-y: auto; }
.cook-step b { background: var(--herb-soft); color: var(--ink); padding: 0 6px; border-radius: 6px; }
.cook-ing { overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; font-size: 1.1rem; }
.cook-ing h3 { margin-bottom: 8px; }
.cook-ing .sub-li::before { display: none; }
.cook-tbtns .btn { font-size: 1rem; }
.cook-timers { display: flex; gap: 6px; flex-wrap: wrap; }
.cook-timers .ct { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .9rem; font-variant-numeric: tabular-nums; }
.cook-timers .ct.done { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cook-nav { display: grid; grid-template-columns: auto 1fr 1.3fr; gap: 8px; }
.cook-nav .btn { white-space: nowrap; padding-left: 14px; padding-right: 14px; }
.cook-hint { margin: 0; text-align: center; }

/* nutrition, ask, journal */
.nut { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; }
.nut div { background: var(--bg); border-radius: 10px; padding: 8px 10px; display: grid; }
.nut b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.nut span { color: var(--muted); font-size: .78rem; }
.ask-ideas { gap: 6px; margin-top: 8px; }
.ask-ideas .chip { font-size: .8rem; }
.answer-box { margin-top: 10px; background: var(--bg); border-radius: 12px; padding: 12px; display: grid; gap: 6px; }
.answer { white-space: pre-wrap; }
.comment.made { background: color-mix(in srgb, var(--herb) 8%, transparent); border-radius: 10px; padding: 8px; }
.comment details summary { cursor: pointer; }
.jphoto { display: block; margin-top: 6px; width: 140px; height: 105px; border-radius: 10px; overflow: hidden; position: relative; }
.jphoto img { width: 100%; height: 100%; object-fit: cover; }
.made-panel { display: grid; gap: 10px; border-color: var(--herb); }
.star-btns.big button { font-size: 2rem; padding: 2px 4px; }

/* settings */
.panel h3 { font-size: 1.05rem; }
.howto { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: .94rem; }
.howto ul { margin: 4px 0 0; padding-left: 18px; }
.howto code, .copybox code { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; font-size: .84rem; word-break: break-all; }
.copybox { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.copybox code { flex: 1; display: block; padding: 6px 8px; }

/* splash */
#splash { position: fixed; inset: 0; z-index: 100; background: #25553b; display: grid; place-items: center; transition: opacity .3s ease; }
#splash.out { opacity: 0; }
.splash-inner { display: grid; justify-items: center; gap: 14px; }
.splash-inner img { border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
.splash-name { font-family: var(--display); font-weight: 700; font-size: 1.8rem; color: #fbf6e9; }
.splash-name span { color: #f2b425; }
@media (prefers-reduced-motion: reduce) { .timer.done { animation: none; } #splash { transition: none; } }

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Nosh <span>Stash</span></h1><button class="status" id="status" data-act="who" style="border:0;background:none;padding:0">Locked</button></div>
    <div class="search" id="searchRow"><input id="q" type="search" placeholder="Search recipes, ingredients, tags" aria-label="Search recipes"></div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="inner">
  <a href="#feed" data-v="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Recipes</a>
  <a href="#plan" data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Plan</a>
  <a href="#grocery" data-v="grocery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h11L21 8H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="18" cy="19" r="1.5"/></svg>Groceries</a>
  <a href="#add" data-v="add" class="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add recipe</a>
</div></nav>
<div id="sheet"></div>
<div id="cook" hidden></div>
<div id="timerBar" class="timer-bar" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="splash" hidden><div class="splash-inner"><img src="apple-touch-icon.png" alt="" width="96" height="96"><div class="splash-name">Nosh <span>Stash</span></div></div></div>

<script>
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const VIEWS = ["feed", "plan", "grocery", "add", "settings"];

  // Paste your Apps Script web app URL here (Deploy > Manage deployments > Web app URL).
  const API_URL = "https://script.google.com/macros/s/AKfycbx5entc0_xagIDuLtSfzProiVpDXmGZUixzrDlYEWShukMXbNC9430dzyj5xdcYqRzY/exec";

  const S = {
    me: "", passcode: "", gateErr: "", mem: {}, badImg: new Set(), heroIdx: 0, formImages: [], formKey: null,
    plan: [], weekOffset: 0, planPick: null, planQ: "", coll: null, gView: "aisle",
    scale: 1, units: "orig", timers: [], cook: null, wake: null, audio: null,
    madeOpen: false, madeRating: 0, madePhoto: "", askQ: "", askBusy: false, askAnswer: null, planFor: false, nutBusy: false,
    pantryOpen: false, pantry: "", actMore: false, lastSeen: 0, dupOk: false,
    canWrite: true, canAI: false, canImages: false,
    recipes: [], grocery: [], allComments: [], loaded: false, stale: false, changeName: false,
    view: "feed", q: "", tag: null,
    openId: null, comments: [], editing: false,
    addMode: "paste", draft: null, photo: null, photoUrl: null, busy: false, err: "",
    paste: "", deleteArm: false, checks: new Set(),
  };

  // ---------- helpers ----------
  const now = () => Date.now();
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600); }
  function ago(ms) {
    if (!ms) return "";
    const s = Math.round((now() - ms) / 1000);
    if (s < 60) return "just now";
    const m = Math.round(s / 60); if (m < 60) return m + "m ago";
    const h = Math.round(m / 60); if (h < 24) return h + "h ago";
    const d = Math.round(h / 24); if (d < 7) return d + "d ago";
    return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function sourceOf(url) {
    if (!url) return "";
    try {
      const h = new URL(url).hostname.replace(/^www\./, "");
      if (/instagram\.com$/.test(h)) return "Instagram";
      if (/tiktok\.com$/.test(h)) return "TikTok";
      if (/youtube\.com$|youtu\.be$/.test(h)) return "YouTube";
      if (/pinterest\./.test(h)) return "Pinterest";
      if (/nytimes\.com$/.test(h)) return "NYT Cooking";
      return h;
    } catch { return ""; }
  }
  function titleFromUrl(url) {
    try {
      const u = new URL(url);
      const seg = u.pathname.split("/").filter(Boolean).filter((p) => !/^\d+$/.test(p) && p.length > 3 && !/^(p|reel|reels|video|recipe|recipes)$/i.test(p)).pop();
      if (seg) return seg.replace(/[-_]+/g, " ").replace(/\.\w+$/, "").replace(/\b\w/g, (c) => c.toUpperCase());
      return "Saved from " + (sourceOf(url) || "a link");
    } catch { return "Saved recipe"; }
  }
  function name(id) { return id ? String(id) : "Someone"; }
  function firstName(id) { return name(id).split(" ")[0]; }
  function initials(id) { const n = name(id); return n.split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase(); }
  function avg(r) { const v = Object.values(r.ratings || {}).filter((n) => n > 0); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; }
  function starStr(n) { const f = Math.round(n); return "★".repeat(f) + "☆".repeat(5 - f); }
  function photosOf(r) {
    const list = [];
    if (r.imageId) list.push("https://drive.google.com/thumbnail?id=" + encodeURIComponent(r.imageId) + "&sz=w1200");
    (r.images || []).forEach((u) => { if (/^https:\/\//.test(u) && !list.includes(u)) list.push(u); });
    return list.filter((u) => !S.badImg.has(u));
  }
  function imgUrl(r) { return photosOf(r)[0] || ""; }
  // Blog photos load straight from the blog. no-referrer gets past most hotlink blocks; a photo that still fails is dropped.
  function imgTag(u, alt, eager) { return `<img src="${esc(u)}" alt="${esc(alt || "")}" ${eager ? "" : 'loading="lazy"'} referrerpolicy="no-referrer" data-src="${esc(u)}">`; }
  function needsDetails(r) { return !(r.ingredients && r.ingredients.filter((l) => !/^##/.test(l)).length) && !(r.steps && r.steps.length); }
  function getRecipe(id) { return S.recipes.find((r) => r.id === id); }
  const isHead = (l) => /^##\s*/.test(l);
  const headText = (l) => l.replace(/^##\s*/, "");
  function cleanUrl(u) {
    try {
      const x = new URL(u);
      ["igsh", "igshid", "utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term", "fbclid", "si", "_t", "_r", "is_from_webapp", "sender_device"].forEach((k) => x.searchParams.delete(k));
      x.hash = "";
      return x.toString().replace(/\?$/, "");
    } catch { return u; }
  }
  function splitPaste(txt) {
    const m = (txt || "").match(/https?:\/\/[^\s<>"')]+/i);
    const url = m ? cleanUrl(m[0].replace(/[.,!?]+$/, "")) : "";
    const rest = (txt || "").replace(/https?:\/\/[^\s<>"')]+/gi, "").trim();
    return { url, rest };
  }
  // Bold the times and temperatures so they're easy to spot mid-cook. Input is already escaped.
  function cue(html) {
    return html.replace(/(\d+(?:\s?(?:-|–|to)\s?\d+)?\s?(?:°\s?[FC]|degrees(?:\s?[FC])?|minutes?|mins?|hours?|hrs?|seconds?|secs?)\b)/gi, "<b>$1</b>");
  }
  function groups(lines) {
    const out = [];
    let cur = { name: "", items: [] };
    (lines || []).forEach((l) => {
      if (isHead(l)) { if (cur.items.length || cur.name) out.push(cur); cur = { name: headText(l), items: [] }; }
      else cur.items.push(l);
    });
    if (cur.items.length || cur.name) out.push(cur);
    return out;
  }

  // ---------- backend (Google Apps Script) ----------
  const LS = {
    get(k) { try { return localStorage.getItem("rf-" + k) || ""; } catch { return S.mem[k] || ""; } },
    set(k, v) { try { localStorage.setItem("rf-" + k, v); } catch { S.mem[k] = v; } },
    del(k) { try { localStorage.removeItem("rf-" + k); } catch { delete S.mem[k]; } },
  };

  async function api(action, data) {
    if (!API_URL || /PASTE_/.test(API_URL)) throw { code: "setup", message: "The app isn't connected to its backend yet. Paste the Apps Script web app URL into index.html." };
    let res;
    try {
      // text/plain keeps this a "simple" request so Apps Script needs no CORS preflight.
      res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, data, passcode: S.passcode }) });
    } catch { throw { code: "network", message: "Couldn't reach the recipe box. Check your connection." }; }
    let j;
    try { j = await res.json(); } catch { throw { code: "network", message: "The backend sent back something unexpected. Check the web app URL and that it's deployed for Anyone." }; }
    if (!j.ok) {
      if (j.code === "passcode") { S.passcode = ""; LS.del("passcode"); S.gateErr = "That passcode didn't work. Try again."; render(); }
      throw { code: j.code, message: j.message };
    }
    return j.data;
  }

  async function load(quiet) {
    if (!S.passcode || !S.me) return;
    if (load._busy) return; load._busy = true;
    try {
      const d = await api("list", {});
      S.recipes = (d.recipes || []).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      S.allComments = d.comments || [];
      S.grocery = (d.grocery || []).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      S.plan = d.plan || [];
      S.canAI = !!d.ai; S.canImages = !!d.ai;
      S.loaded = true; S.stale = false; S.err = S.err && S.err.startsWith("Couldn't load") ? "" : S.err;
      LS.set("unlocked", "1");
      saveCache();
      syncComments();
      hideSplash();
      render();
      if (S.cook) renderCook();
    } catch (e) {
      S.loaded = true;
      hideSplash();
      if (e.code !== "passcode") { if (!S.recipes.length) S.err = "Couldn't load recipes. " + (e.message || ""); else S.stale = true; render(); }
    } finally { load._busy = false; }
  }

  // Keep a copy on the phone so the app opens instantly and works on spotty Wi-Fi.
  function saveCache() {
    try {
      const slim = S.recipes.map((r) => ({ ...r, rawText: r.rawText ? r.rawText.slice(0, 1500) : "" }));
      localStorage.setItem("rf-cache", JSON.stringify({ recipes: slim, comments: S.allComments, grocery: S.grocery, plan: S.plan, ai: S.canAI, at: now() }));
    } catch { /* storage full or unavailable: fine, it just won't open offline */ }
  }
  function loadCache() {
    try {
      const c = JSON.parse(localStorage.getItem("rf-cache") || "null");
      if (!c || !c.recipes) return false;
      S.recipes = c.recipes; S.allComments = c.comments || []; S.grocery = c.grocery || []; S.plan = c.plan || [];
      S.canAI = !!c.ai; S.canImages = !!c.ai; S.loaded = true; S.stale = true;
      return true;
    } catch { return false; }
  }
  function hideSplash() { const sp = $("#splash"); if (sp && !sp.hidden) { sp.classList.add("out"); setTimeout(() => (sp.hidden = true), 350); } }

  function syncComments() {
    S.comments = S.openId ? S.allComments.filter((c) => c.recipeId === S.openId).sort((a, b) => a.createdAt - b.createdAt) : [];
  }

  // Apply the server's copy of a recipe locally so the screen updates right away.
  function putRecipe(r) {
    if (!r || !r.id) return;
    const i = S.recipes.findIndex((x) => x.id === r.id);
    if (i >= 0) S.recipes[i] = r; else S.recipes.unshift(r);
    render();
  }
  const Data = {
    save: async (doc) => { const r = await api("saveRecipe", { recipe: doc }); putRecipe(r); return r; },
    update: async (id, patch) => { const r = await api("updateRecipe", { id, patch }); putRecipe(r); return r; },
    del: async (id) => { await api("deleteRecipe", { id }); S.recipes = S.recipes.filter((r) => r.id !== id); render(); },
    comment: async (recipeId, text, extra = {}) => { const c = await api("addComment", { recipeId, text, by: S.me, ...extra }); S.allComments.push(c); syncComments(); render(); return c; },
    planAdd: async (date, recipeId) => { const e = await api("planAdd", { date, recipeId, by: S.me }); S.plan.push(e); render(); return e; },
    planDelete: async (ids) => { const set = new Set(ids); S.plan = S.plan.filter((p) => !set.has(p.id)); render(); await api("planDelete", { ids }); },
    groceryAdd: async (items) => { const gs = await api("groceryAdd", { items }); S.grocery.push(...gs); render(); return gs; },
    groceryUpdate: async (id, done) => { const g = S.grocery.find((x) => x.id === id); if (g) g.done = done; render(); await api("groceryUpdate", { id, done }); },
    groceryDelete: async (ids) => { const set = new Set(ids); S.grocery = S.grocery.filter((g) => !set.has(g.id)); render(); await api("groceryDelete", { ids }); },
  };

  function init() {
    S.passcode = LS.get("passcode");
    S.me = LS.get("name");
    S.units = LS.get("units") || "orig";
    S.gView = LS.get("gview") || "aisle";
    S.lastSeen = +LS.get("seen") || 0;
    const standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
    if (standalone && S.passcode && S.me) { $("#splash").hidden = false; setTimeout(hideSplash, 2500); }
    if (S.passcode && S.me) { if (loadCache()) setTimeout(hideSplash, 250); }
    render();
    if (S.passcode && S.me) load();
    // Remember when this person last looked, so the activity feed can mark what's new.
    window.addEventListener("pagehide", () => LS.set("seen", String(now())));
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") LS.set("seen", String(now())); });
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
    // Keep both phones in sync: refresh every 30 s while open, and when the app comes back to the front.
    setInterval(() => { if (document.visibilityState === "visible" && !S.editing && !S.draft && !S.busy) load(true); }, 30000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(true); });
  }

  async function write(fn, okMsg) {
    try { await fn(); if (okMsg) toast(okMsg); return true; }
    catch (e) {
      if (e && e.code === "passcode") toast("Enter the passcode again.");
      else if (e && e.code === "not_found") { toast("That recipe was deleted on the other phone."); load(true); }
      else toast((e && e.message) || "Couldn't save. Check your connection and try again.");
      return false;
    }
  }

  // ---------- organizing (runs on the backend) ----------
  async function extract(material, images, url) {
    let imageBase64 = "";
    if (images && images.length) imageBase64 = await toBase64(images[0]);
    const v = await api("organize", { text: material || "", url: url || "", imageBase64, mime: "image/jpeg" });
    if (!v || typeof v !== "object") throw { message: "No recipe came back." };
    const arr = (x) => (Array.isArray(x) ? x.map((s) => String(s).trim()).filter(Boolean) : []);
    return {
      isRecipe: v.isRecipe !== false,
      title: String(v.title || "").trim(),
      summary: String(v.summary || "").trim(), credit: String(v.credit || "").trim(),
      ingredients: arr(v.ingredients), steps: arr(v.steps).map((s) => s.replace(/^(?:step\s*)?\d+[.):]\s*/i, "")),
      tags: arr(v.tags).map((t) => t.toLowerCase().replace(/^#/, "")).slice(0, 6),
      time: String(v.time || ""), servings: String(v.servings || ""), notes: String(v.notes || ""),
      images: arr(v.photoUrls).filter((u) => /^https:\/\//.test(u)).slice(0, 8),
    };
  }

  function toBase64(blob) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(String(fr.result).split(",")[1] || "");
      fr.onerror = () => rej(new Error("Couldn't read that image."));
      fr.readAsDataURL(blob);
    });
  }

  function shrink(file, max = 1600) {
    return new Promise((res, rej) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob((b) => (b ? res(b) : rej(new Error("Couldn't read that image."))), "image/jpeg", 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("That file isn't an image this browser can read.")); };
      img.src = url;
    });
  }

  async function uploadPhoto(blob) {
    if (!blob) return null;
    try { const a = await api("uploadPhoto", { base64: await toBase64(blob), mime: "image/jpeg" }); return a.id; } catch { toast("The photo didn't upload, but the recipe saved."); return null; }
  }

  // =====================================================================
  // Amounts: parse, scale and convert ingredient quantities
  // =====================================================================
  const UF = { "½": 1 / 2, "⅓": 1 / 3, "⅔": 2 / 3, "¼": 1 / 4, "¾": 3 / 4, "⅛": 1 / 8, "⅜": 3 / 8, "⅝": 5 / 8, "⅞": 7 / 8, "⅕": 1 / 5, "⅙": 1 / 6 };
  const NUM = "(?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:\\.\\d+)?\\s*[½⅓⅔¼¾⅛⅜⅝⅞⅕⅙]|\\d+(?:\\.\\d+)?|[½⅓⅔¼¾⅛⅜⅝⅞⅕⅙])";
  const QTY_RE = new RegExp("^\\s*(" + NUM + ")(?:\\s*(?:-|–|to)\\s*(" + NUM + "))?\\s*");
  const UNITS = [
    { re: /^(fluid ounces?|fl\.?\s?oz\.?)(?=[\s,.)]|$)/i, key: "floz", type: "vol", base: 29.57, one: "fl oz", many: "fl oz" },
    { re: /^(cups?|c\.)(?=[\s,.)]|$)/i, key: "cup", type: "vol", base: 236.6, one: "cup", many: "cups" },
    { re: /^(tablespoons?|tbsps?\.?|tbs\.?|tbl\.?|Tbsp\.?)(?=[\s,.)]|$)/i, key: "tbsp", type: "vol", base: 14.79, one: "tbsp", many: "tbsp" },
    { re: /^(teaspoons?|tsps?\.?)(?=[\s,.)]|$)/i, key: "tsp", type: "vol", base: 4.93, one: "tsp", many: "tsp" },
    { re: /^(pints?|pt\.?)(?=[\s,.)]|$)/i, key: "pint", type: "vol", base: 473.2, one: "pint", many: "pints" },
    { re: /^(quarts?|qts?\.?)(?=[\s,.)]|$)/i, key: "quart", type: "vol", base: 946.4, one: "quart", many: "quarts" },
    { re: /^(gallons?|gal\.?)(?=[\s,.)]|$)/i, key: "gallon", type: "vol", base: 3785, one: "gallon", many: "gallons" },
    { re: /^(milliliters?|millilitres?|mls?)(?=[\s,.)]|$)/i, key: "ml", type: "vol", base: 1, one: "ml", many: "ml" },
    { re: /^(liters?|litres?|l)(?=[\s,.)]|$)/i, key: "l", type: "vol", base: 1000, one: "l", many: "l" },
    { re: /^(ounces?|oz\.?)(?=[\s,.)]|$)/i, key: "oz", type: "wt", base: 28.35, one: "oz", many: "oz" },
    { re: /^(pounds?|lbs?\.?)(?=[\s,.)]|$)/i, key: "lb", type: "wt", base: 453.6, one: "lb", many: "lb" },
    { re: /^(grams?|g)(?=[\s,.)]|$)/i, key: "g", type: "wt", base: 1, one: "g", many: "g" },
    { re: /^(kilograms?|kgs?)(?=[\s,.)]|$)/i, key: "kg", type: "wt", base: 1000, one: "kg", many: "kg" },
  ];
  const unitByKey = Object.fromEntries(UNITS.map((u) => [u.key, u]));

  function parseNum(t) {
    t = String(t).trim();
    let m;
    if ((m = t.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2] / m[3];
    if ((m = t.match(/^(\d+)\/(\d+)$/))) return m[1] / m[2];
    if ((m = t.match(/^(\d+(?:\.\d+)?)\s*([½⅓⅔¼¾⅛⅜⅝⅞⅕⅙])$/))) return +m[1] + UF[m[2]];
    if (UF[t] != null) return UF[t];
    return parseFloat(t);
  }

  // 1.5 -> "1½", 0.333 -> "⅓", 12.4 -> "12½"
  function fmtNum(n) {
    if (!isFinite(n) || n <= 0) return "";
    const fr = n >= 10 ? [[0, ""], [0.5, "½"], [1, ""]] : [[0, ""], [1 / 8, "⅛"], [1 / 4, "¼"], [1 / 3, "⅓"], [3 / 8, "⅜"], [1 / 2, "½"], [5 / 8, "⅝"], [2 / 3, "⅔"], [3 / 4, "¾"], [7 / 8, "⅞"], [1, ""]];
    let whole = Math.floor(n + 1e-9);
    const frac = n - whole;
    let best = fr[0], d = 9;
    for (const f of fr) { const dd = Math.abs(frac - f[0]); if (dd < d) { d = dd; best = f; } }
    if (n < 10 && d > 0.05) return String(Math.round(n * 100) / 100);
    if (best[0] === 1) whole += 1;
    return (whole ? String(whole) : "") + (best[0] === 1 ? "" : best[1]) || "0";
  }

  function parseIng(line) {
    const s = String(line);
    const m = s.match(QTY_RE);
    if (!m) return { qty: null, raw: s, rest: s };
    const qty = parseNum(m[1]);
    const qty2 = m[2] ? parseNum(m[2]) : null;
    let rest = s.slice(m[0].length);
    let unit = null, unitText = "";
    for (const u of UNITS) {
      const um = rest.match(u.re);
      if (um) { unit = u; unitText = um[0]; rest = rest.slice(um[0].length).replace(/^\.?\s*/, ""); break; }
    }
    return { qty, qty2, unit, unitText, rest, raw: s };
  }

  function roundMetric(v, type) {
    if (v >= 1000) return { v: Math.round(v / 100) / 10, unit: type === "wt" ? "kg" : "l" };
    const step = v >= 100 ? 5 : v >= 20 ? 1 : 0.5;
    return { v: Math.max(step, Math.round(v / step) * step), unit: type === "wt" ? "g" : "ml" };
  }

  function toUS(v, type) {
    if (type === "wt") return v >= 453.6 ? { v: v / 453.6, unit: unitByKey.lb } : { v: v / 28.35, unit: unitByKey.oz };
    if (v >= 3785) return { v: v / 946.4, unit: unitByKey.quart };
    if (v >= 59) return { v: v / 236.6, unit: unitByKey.cup };
    if (v >= 14.79) return { v: v / 14.79, unit: unitByKey.tbsp };
    return { v: v / 4.93, unit: unitByKey.tsp };
  }

  // Scale and/or convert one ingredient line. mode: "orig" | "us" | "metric".
  function scaleLine(line, factor, mode) {
    if (isHead(line)) return line;
    const p = parseIng(line);
    if (p.qty == null || (factor === 1 && mode === "orig")) return line;
    let q = p.qty * factor, q2 = p.qty2 != null ? p.qty2 * factor : null;
    const u = p.unit;
    const out = (a, b, label) => (b != null ? fmtNum(a) + "–" + fmtNum(b) : fmtNum(a)) + (label ? " " + label : "") + (p.rest ? " " + p.rest : "");
    if (u && mode === "metric" && !["ml", "l", "g", "kg", "tsp", "tbsp"].includes(u.key)) {
      const a = roundMetric(q * u.base, u.type), b = q2 != null ? roundMetric(q2 * u.base, u.type) : null;
      const unitLabel = b && b.unit !== a.unit ? a.unit : a.unit;
      return (b != null ? a.v + "–" + b.v : String(a.v)) + " " + unitLabel + (p.rest ? " " + p.rest : "");
    }
    if (u && mode === "us" && ["ml", "l", "g", "kg"].includes(u.key)) {
      const a = toUS(q * u.base, u.type);
      const b = q2 != null ? q2 * u.base / a.unit.base : null;
      return out(a.v, b, a.v > 1 ? a.unit.many : a.unit.one);
    }
    const label = u ? (u.key === "cup" ? (q > 1 || q2 ? "cups" : "cup") : p.unitText.trim()) : "";
    return out(q, q2, label);
  }

  // Oven temperatures in steps follow the unit choice.
  function convertTemps(text, mode) {
    if (mode === "metric") return text.replace(/(\d{3})\s*°\s*F\b/g, (m, f) => Math.round((f - 32) * 5 / 9 / 5) * 5 + "°C");
    if (mode === "us") return text.replace(/(\d{2,3})\s*°\s*C\b/g, (m, c) => Math.round((c * 9 / 5 + 32) / 5) * 5 + "°F");
    return text;
  }

  function baseServings(r) { const m = String(r.servings || "").match(/\d+(\.\d+)?/); return m ? parseFloat(m[0]) : 0; }

  // =====================================================================
  // Timers (from step text) and cook mode
  // =====================================================================
  const TIME_RE = /(\d+(?:\.\d+)?)(?:\s*(?:-|–|to)\s*(\d+(?:\.\d+)?))?\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)\b/gi;
  function timesIn(text) {
    const out = [];
    let m;
    TIME_RE.lastIndex = 0;
    while ((m = TIME_RE.exec(text))) {
      const n = parseFloat(m[1]);
      const unit = m[3].toLowerCase();
      const secs = unit.startsWith("h") ? n * 3600 : unit.startsWith("m") ? n * 60 : n;
      if (secs >= 10 && secs <= 24 * 3600) out.push({ secs, label: m[0].replace(/\s+/g, " ") });
    }
    return out;
  }
  function fmtClock(s) {
    s = Math.max(0, Math.round(s));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0");
  }

  function beep() {
    try {
      const ctx = S.audio || (S.audio = new (window.AudioContext || window.webkitAudioContext)());
      ctx.resume && ctx.resume();
      [0, 0.35, 0.7].forEach((t) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.28);
        o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3);
      });
    } catch { /* no sound available */ }
  }

  function startTimer(secs, label, recipeTitle) {
    try { if (!S.audio) S.audio = new (window.AudioContext || window.webkitAudioContext)(); S.audio.resume && S.audio.resume(); } catch {}
    S.timers.push({ id: Math.random().toString(36).slice(2), label, recipeTitle, end: now() + secs * 1000, secs, done: false });
    renderTimers();
    toast("Timer started: " + label);
  }

  function renderTimers() {
    const bar = $("#timerBar");
    if (!bar) return;
    document.body.classList.toggle("has-timers", S.timers.length > 0);
    if (!S.timers.length) { bar.hidden = true; bar.innerHTML = ""; return; }
    bar.hidden = false;
    bar.innerHTML = S.timers.map((t) => {
      const left = (t.end - now()) / 1000;
      return `<div class="timer${t.done ? " done" : ""}"><span class="t-label">${esc(t.label)}</span><b class="t-clock">${t.done ? "Done!" : fmtClock(left)}</b>
        <button data-tstop="${t.id}" aria-label="${t.done ? "Dismiss" : "Cancel"} timer">${t.done ? "OK" : "×"}</button></div>`;
    }).join("");
  }

  setInterval(() => {
    if (!S.timers.length) return;
    let rang = false;
    S.timers.forEach((t) => { if (!t.done && t.end <= now()) { t.done = true; rang = true; } });
    if (rang) { beep(); toast("Timer done!"); try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch {} }
    renderTimers();
    if (S.cook) { const c = $("#cookTimers"); if (c) c.innerHTML = cookTimersHTML(); }
  }, 1000);

  async function keepAwake(on) {
    try {
      if (on && "wakeLock" in navigator) S.wake = await navigator.wakeLock.request("screen");
      else if (!on && S.wake) { await S.wake.release(); S.wake = null; }
    } catch { S.wake = null; }
  }
  document.addEventListener("visibilitychange", () => { if (S.cook && document.visibilityState === "visible") keepAwake(true); });

  function cookSteps(r) {
    const list = [];
    groups(r.steps || []).forEach((g) => g.items.forEach((s) => list.push({ text: s, section: g.name })));
    return list;
  }

  function openCook() {
    const r = getRecipe(S.openId);
    if (!r || !(r.steps || []).length) { toast("This recipe has no steps yet."); return; }
    S.cook = { id: r.id, idx: 0, showIng: false };
    keepAwake(true);
    renderCook();
  }
  function closeCook() { S.cook = null; keepAwake(false); renderCook(); }

  function cookTimersHTML() {
    const mine = S.timers.filter((t) => !t.done || true);
    return mine.map((t) => `<span class="ct${t.done ? " done" : ""}">${esc(t.label)} · <b>${t.done ? "Done!" : fmtClock((t.end - now()) / 1000)}</b></span>`).join("");
  }

  function renderCook() {
    const host = $("#cook");
    if (!S.cook) { host.innerHTML = ""; host.hidden = true; return; }
    const r = getRecipe(S.cook.id);
    if (!r) { closeCook(); return; }
    const steps = cookSteps(r);
    const i = Math.min(S.cook.idx, steps.length - 1);
    const st = steps[i];
    const text = convertTemps(st.text, S.units);
    const ts = timesIn(st.text);
    host.hidden = false;
    host.innerHTML = `<div class="cook" role="dialog" aria-modal="true" aria-label="Cooking ${esc(r.title)}">
      <div class="cook-top"><div><div class="cook-title">${esc(r.title)}</div><div class="cook-count">Step ${i + 1} of ${steps.length}${st.section ? " · " + esc(st.section) : ""}</div></div>
        <button class="btn" data-act="cook-close">Done</button></div>
      <div class="cook-dots">${steps.map((_, k) => `<span class="${k < i ? "past" : k === i ? "now" : ""}"></span>`).join("")}</div>
      ${S.cook.showIng ? `<div class="cook-ing"><h3>Ingredients${S.scale !== 1 ? " (" + fmtNum(S.scale) + "×)" : ""}</h3><ul class="ing">${(r.ingredients || []).map((l, k) => isHead(l) ? `<li class="sub-li"><h4 class="sub">${esc(headText(l))}</h4></li>` : `<li><button class="tick${S.checks.has("c" + k) ? " on" : ""}" data-check="c${k}">${esc(scaleLine(l, S.scale, S.units))}</button></li>`).join("")}</ul></div>`
        : `<div class="cook-step">${cue(esc(text))}</div>`}
      ${ts.length && !S.cook.showIng ? `<div class="row cook-tbtns">${ts.map((t) => `<button class="btn primary" data-timer="${t.secs}" data-tlabel="${esc(t.label)}">Start ${esc(t.label)} timer</button>`).join("")}</div>` : ""}
      <div id="cookTimers" class="cook-timers">${cookTimersHTML()}</div>
      <div class="cook-nav">
        <button class="btn big" data-act="cook-prev" ${i === 0 ? "disabled" : ""} aria-label="Previous step">‹ Back</button>
        <button class="btn big ghost" data-act="cook-ing">${S.cook.showIng ? "Steps" : "Ingredients"}</button>
        ${i < steps.length - 1 ? `<button class="btn big herb" data-act="cook-next" aria-label="Next step">Next ›</button>` : `<button class="btn big primary" data-act="cook-finish">Finished!</button>`}
      </div>
      <p class="note cook-hint">${"wakeLock" in navigator ? "Your screen will stay on while this is open." : "Tip: turn off Auto-Lock in Settings while you cook."}</p>
    </div>`;
  }

  // =====================================================================
  // Groceries: merge duplicates and sort by store section
  // =====================================================================
  const AISLES = [
    ["Spices & seasonings", /\b(salt|black pepper|white pepper|peppercorns?|pepper flakes|red pepper flakes|cayenne|chili powder|chile powder|garlic powder|onion powder|cumin|paprika|oregano|cinnamon|nutmeg|turmeric|coriander|curry powder|garam masala|bay lea|vanilla|seasoning|spice|italian herbs|dried (thyme|oregano|basil|rosemary)|cloves? \(spice\)|allspice|smoked paprika)/i],
    ["Canned & jarred", /\b(canned|can of|cans?\b|jarred|broth|stock\b|bouillon|tomato paste|tomato sauce|crushed tomato|diced tomato|coconut milk|chickpeas?|black beans|kidney beans|pinto beans|cannellini|white beans|refried|salsa|pesto|olives|capers|pickles?|marinara)/i],
    ["Produce", /\b(apple|banana|lemon|lime|orange|berr|grape|melon|peach|pear|plum|cherr|mango|pineapple|avocado|tomato|potato|onion|shallot|garlic|ginger|scallion|green onion|leek|carrot|celery|bell pepper|peppers?\b|jalape|chile|chili(?! powder)|lettuce|spinach|kale|arugula|cabbage|broccoli|cauliflower|zucchini|squash|cucumber|mushroom|corn(?!starch| syrup|meal)|peas?\b|green beans|bean sprout|basil|cilantro|parsley|mint|dill|thyme|rosemary|sage|chive|beet|radish|sweet potato|yam|asparagus|eggplant|brussels|fennel|bok choy)/i],
    ["Meat & seafood", /\b(chicken|beef|pork|bacon|sausage|turkey|lamb|steak|ground|ham\b|prosciutto|salami|chorizo|shrimp|salmon|tuna|cod|fish(?! sauce)|scallop|crab|lobster|clam|mussel|thigh|breast|wing|ribs?\b)/i],
    ["Dairy & eggs", /\b(milk|butter(?!milk)|buttermilk|cream|cheese|parmesan|cheddar|mozzarella|feta|ricotta|yogurt|sour cream|eggs?\b|half-and-half|half and half|ghee)/i],
    ["Bakery", /\b(bread|buns?\b|rolls?\b|tortillas?|pita|naan|bagels?|baguette|croissant|brioche)/i],
    ["Frozen", /\b(frozen|ice cream)/i],
    ["Pantry", /\b(flour|sugar|rice|pasta|noodle|spaghetti|oats|quinoa|lentil|oil|vinegar|soy sauce|honey|maple|syrup|baking|yeast|cornstarch|breadcrumb|panko|nuts?\b|almond|peanut|walnut|pecan|cashew|chocolate|cocoa|mustard|ketchup|mayo|sriracha|hot sauce|worcestershire|fish sauce|miso|tahini|cracker|cereal|raisin|dried)/i],
    ["Drinks", /\b(wine|beer|juice|coffee|tea\b|soda|sparkling|vodka|rum|tequila|whiskey|bourbon)/i],
  ];
  function aisleOf(name) { for (const [a, re] of AISLES) if (re.test(name)) return a; return "Other"; }

  function groceryKey(text) {
    const p = parseIng(text);
    let name = (p.qty == null ? text : p.rest).toLowerCase()
      .replace(/\(.*?\)/g, "").split(",")[0].replace(/^of\s+/, "")
      .replace(/\b(large|medium|small|fresh|chopped|minced|diced|sliced|finely|roughly|about|plus more|to taste|for serving|optional|whole|boneless|skinless)\b/g, "")
      .replace(/\s+/g, " ").trim();
    const single = name.replace(/ies$/, "y").replace(/(tomato|potato)es$/, "$1").replace(/([^s])s$/, "$1");
    return { key: single + "|" + (p.unit ? p.unit.type + ":" + p.unit.key : p.qty == null ? "x" : "n"), p, name: single };
  }

  function mergedGrocery() {
    const map = new Map();
    S.grocery.forEach((g) => {
      const k = groceryKey(g.text);
      if (!map.has(k.key)) map.set(k.key, { key: k.key, name: k.name, items: [], aisle: aisleOf(k.name || g.text) });
      map.get(k.key).items.push({ g, p: k.p });
    });
    return [...map.values()].map((row) => {
      const its = row.items;
      const allQty = its.every((x) => x.p.qty != null);
      let text;
      if (its.length === 1) text = its[0].g.text;
      else if (allQty) {
        const sum = its.reduce((a, x) => a + x.p.qty, 0);
        const u = its[0].p.unit;
        const label = u ? (u.key === "cup" ? (sum > 1 ? "cups" : "cup") : its[0].p.unitText.trim()) : "";
        text = fmtNum(sum) + (label ? " " + label : "") + " " + its[0].p.rest;
      } else text = its[0].g.text + " (+" + (its.length - 1) + " more)";
      const sources = [...new Set(its.map((x) => x.g.recipeTitle).filter(Boolean))];
      return { ...row, text, ids: its.map((x) => x.g.id), done: its.every((x) => x.g.done), sources };
    });
  }

  // =====================================================================
  // Meal plan helpers
  // =====================================================================
  const ymd = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  function weekStart(offset) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + offset * 7); return d; }
  function dayLabel(s, long) {
    const d = new Date(s + "T12:00:00");
    const today = ymd(new Date()), tmr = ymd(new Date(Date.now() + 864e5));
    if (s === today) return "Today";
    if (s === tmr) return "Tomorrow";
    return d.toLocaleDateString(undefined, long ? { weekday: "long", month: "short", day: "numeric" } : { weekday: "short", month: "short", day: "numeric" });
  }

  // =====================================================================
  // Activity feed
  // =====================================================================
  function activity(limit) {
    const ev = [];
    S.recipes.forEach((r) => { if (r.createdAt) ev.push({ t: r.createdAt, by: r.addedBy, kind: "add", r }); });
    S.allComments.forEach((c) => { const r = getRecipe(c.recipeId); if (r && c.createdAt) ev.push({ t: c.createdAt, by: c.by, kind: c.kind || "note", r, c }); });
    S.plan.forEach((p) => { const r = getRecipe(p.recipeId); if (r && p.createdAt) ev.push({ t: p.createdAt, by: p.by, kind: "plan", r, p }); });
    return ev.sort((a, b) => b.t - a.t).slice(0, limit);
  }
  function activityText(e) {
    const who = `<b>${esc(e.by === S.me ? "You" : firstName(e.by))}</b>`, t = `<b>${esc(e.r.title)}</b>`;
    if (e.kind === "add") return `${who} stashed ${t}`;
    if (e.kind === "made") return `${who} cooked ${t}${e.c.rating ? ` <span class="stars">${"★".repeat(e.c.rating)}</span>` : ""}`;
    if (e.kind === "ask") return `${who} asked about ${t}`;
    if (e.kind === "plan") return `${who} planned ${t} for ${esc(dayLabel(e.p.date))}`;
    return `${who} left a note on ${t}`;
  }

  // =====================================================================
  // "What can I make?" — match saved recipes against what's on hand
  // =====================================================================
  const STAPLES = /^(salt|kosher salt|sea salt|pepper|black pepper|ground black pepper|freshly ground black pepper|salt and pepper|water|olive oil|extra virgin olive oil|extra-virgin olive oil|vegetable oil|canola oil|oil|ice|cooking spray|nonstick spray)$/i;
  function pantryMatches(input) {
    const have = input.toLowerCase().split(/[,\n]+/).map((s) => s.trim().replace(/s$/, "")).filter((s) => s.length > 1);
    if (!have.length) return [];
    return S.recipes.map((r) => {
      const lines = (r.ingredients || []).filter((l) => !isHead(l));
      const need = lines.filter((l) => !STAPLES.test(groceryKey(l).name.trim()));
      if (!need.length) return null;
      const missing = [], hit = [];
      need.forEach((l) => { const nm = groceryKey(l).name || l.toLowerCase(); (have.some((h) => nm.includes(h) || h.includes(nm)) ? hit : missing).push(nm); });
      if (!hit.length) return null;
      return { r, hit: hit.length, total: need.length, missing };
    }).filter(Boolean).sort((a, b) => a.missing.length - b.missing.length || b.hit - a.hit).slice(0, 12);
  }

  // =====================================================================
  // Sharing, backup, duplicates
  // =====================================================================
  function recipeAsText(r) {
    const ing = (r.ingredients || []).map((l) => isHead(l) ? "\n" + headText(l).toUpperCase() : "• " + scaleLine(l, S.scale, S.units)).join("\n");
    let n = 0;
    const steps = (r.steps || []).map((s) => isHead(s) ? "\n" + headText(s).toUpperCase() : (++n) + ". " + convertTemps(s, S.units)).join("\n");
    return [r.title, r.summary, [r.time, r.servings ? "Serves " + r.servings : ""].filter(Boolean).join(" · "), "", "INGREDIENTS", ing, "", "STEPS", steps,
      r.notes ? "\nTIPS\n" + r.notes : "", r.credit ? "\nRecipe by " + r.credit : "", r.sourceUrl ? r.sourceUrl : "", "\nShared from Nosh Stash"].filter((x) => x !== undefined && x !== null).join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }

  async function shareRecipe(r) {
    const text = recipeAsText(r);
    try {
      if (navigator.share) { await navigator.share({ title: r.title, text }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(text); toast("Recipe copied. Paste it into a text or email."); }
    catch { toast("Couldn't share from here."); }
  }

  function downloadBackup() {
    const data = { app: "Nosh Stash", exportedAt: new Date().toISOString(), recipes: S.recipes, comments: S.allComments, grocery: S.grocery, plan: S.plan };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "nosh-stash-backup-" + ymd(new Date()) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Backup downloaded.");
  }

  const normTitle = (t) => String(t || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  function findDuplicate(data) {
    const u = data.sourceUrl ? cleanUrl(data.sourceUrl).replace(/\/$/, "") : "";
    const t = normTitle(data.title);
    return S.recipes.find((r) => (u && r.sourceUrl && cleanUrl(r.sourceUrl).replace(/\/$/, "") === u) || (t.length > 4 && normTitle(r.title) === t));
  }

  function allCollections() {
    const c = {};
    S.recipes.forEach((r) => (r.collections || []).forEach((t) => (c[t] = (c[t] || 0) + 1)));
    return Object.entries(c).sort((a, b) => b[1] - a[1]).map(([t]) => t);
  }

  // ---------- render ----------
  function renderTabs() {
    document.querySelectorAll("nav.tabs a").forEach((a) => {
      if (a.dataset.v === S.view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
  }

  function allTags() {
    const c = {};
    S.recipes.forEach((r) => (r.tags || []).forEach((t) => (c[t] = (c[t] || 0) + 1)));
    return Object.entries(c).sort((a, b) => b[1] - a[1]).map(([t]) => t).slice(0, 24);
  }

  function filtered(list) {
    const q = S.q.trim().toLowerCase();
    return list.filter((r) => {
      if (S.coll && !(r.collections || []).includes(S.coll)) return false;
      if (S.tag === "__inbox") { if (!needsDetails(r)) return false; }
      else if (S.tag === "__top") { if (avg(r) < 4) return false; }
      else if (S.tag === "__want") { if (!r.want) return false; }
      else if (S.tag && !(r.tags || []).includes(S.tag)) return false;
      if (!q) return true;
      const hay = [r.title, r.summary, r.notes, r.credit, r.sourceUrl, (r.tags || []).join(" "), (r.collections || []).join(" "), (r.ingredients || []).join(" ")].join(" ").toLowerCase();
      return q.split(/\s+/).every((w) => hay.includes(w));
    });
  }

  function cardHTML(r) {
    const img = imgUrl(r);
    const a = avg(r);
    const src = r.sourceUrl ? sourceOf(r.sourceUrl) : r.sourceType === "photo" ? "Photo" : r.sourceType === "text" ? "Pasted text" : "";
    const pills = [];
    if (r.example) pills.push('<span class="pill example">Example</span>');
    if (r.want) pills.push('<span class="pill want">Want to make</span>');
    if (needsDetails(r)) pills.push('<span class="pill inbox">Needs details</span>');
    if (r.madeCount) pills.push(`<span class="pill">Made ${r.madeCount}×</span>`);
    return `<button class="card${img ? " has-img" : ""}" data-open="${esc(r.id)}">
      ${img ? `<div class="thumb">${imgTag(img, "")}</div>` : ""}
      <div class="body">
        ${pills.length ? `<div class="row">${pills.join("")}</div>` : ""}
        <h3>${esc(r.title || "Untitled recipe")}</h3>
        ${r.summary ? `<div class="note" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(r.summary)}</div>` : ""}
        <div class="meta">
          <span class="who"><span class="avatar" aria-hidden="true">${esc(initials(r.addedBy))}</span>${esc(firstName(r.addedBy))}</span>
          ${src ? `<span>${esc(src)}</span>` : ""}
          ${r.time ? `<span>${esc(r.time)}</span>` : ""}
          ${a ? `<span class="stars" aria-label="Rated ${a.toFixed(1)} of 5">${starStr(a)}</span>` : ""}
          <span>${esc(ago(r.createdAt))}</span>
        </div>
        ${(r.tags || []).length ? `<div class="meta">${r.tags.slice(0, 4).map((t) => "#" + esc(t)).join(" ")}</div>` : ""}
      </div>
    </button>`;
  }

  function statusLine() {
    if (!S.passcode || !S.me) return "Locked";
    if (!S.loaded) return "Loading…";
    if (S.stale) return "Offline, showing saved copy";
    return S.recipes.length + (S.recipes.length === 1 ? " recipe · " : " recipes · ") + S.me;
  }

  function gateView() {
    const known = [...new Set(S.recipes.map((r) => r.addedBy).filter(Boolean))];
    return `<form class="panel" id="gate" style="margin-top:24px;max-width:420px">
      <img src="apple-touch-icon.png" alt="" width="72" height="72" style="border-radius:18px">
      <h2>${S.passcode ? "Who's cooking?" : "Welcome to Nosh Stash"}</h2>
      <p class="note" style="margin:0">${S.passcode ? "Pick the name that goes on the recipes, ratings and notes you add from this phone." : "Enter the household passcode once on this phone. It stays unlocked after that."}</p>
      ${S.passcode ? "" : `<label for="g-pass">Passcode<input id="g-pass" type="password" autocomplete="current-password" required></label>`}
      <label for="g-name">Your name<input id="g-name" type="text" autocomplete="given-name" value="${esc(S.me)}" placeholder="Nathan" required></label>
      ${known.length ? `<div class="row">${known.map((k) => `<button type="button" class="chip" data-pick="${esc(k)}">${esc(k)}</button>`).join("")}</div>` : ""}
      ${S.gateErr ? `<div class="error">${esc(S.gateErr)}</div>` : ""}
      <div class="row"><button class="btn primary" type="submit">${S.passcode ? "Save" : "Unlock"}</button>
      ${S.passcode && S.me ? `<button class="btn ghost" type="button" data-act="gate-cancel">Cancel</button>` : ""}</div>
      ${S.passcode ? `<button type="button" class="btn ghost danger" data-act="lock" style="justify-self:start">Lock this phone</button>` : ""}
    </form>`;
  }

  function render() {
    renderTabs();
    $("#status").textContent = statusLine();
    const gate = !S.passcode || !S.me;
    document.querySelector("nav.tabs").hidden = gate;
    if (gate) { $("#searchRow").hidden = true; $("#chips").hidden = true; $("#main").innerHTML = gateView(); $("#sheet").innerHTML = ""; return; }
    const showSearch = S.view === "feed";
    $("#searchRow").hidden = !showSearch;
    const chips = $("#chips");
    chips.hidden = !showSearch;
    if (showSearch) {
      const special = [["__inbox", "Needs details"], ["__top", "★ 4+"], ["__want", "☆ Want to make"]];
      chips.innerHTML = [`<button class="chip" data-tag="" aria-pressed="${!S.tag && !S.coll}">All</button>`]
        .concat(special.map(([k, l]) => `<button class="chip" data-tag="${k}" aria-pressed="${S.tag === k}">${l}</button>`))
        .concat(allCollections().map((c) => `<button class="chip coll" data-coll="${esc(c)}" aria-pressed="${S.coll === c}">${esc(c)}</button>`))
        .concat(allTags().map((t) => `<button class="chip" data-tag="${esc(t)}" aria-pressed="${S.tag === t}">#${esc(t)}</button>`)).join("");
    }
    const m = $("#main");
    if (S.view === "feed") m.innerHTML = feedView();
    else if (S.view === "plan") m.innerHTML = planView();
    else if (S.view === "grocery") m.innerHTML = groceryView();
    else if (S.view === "settings") m.innerHTML = settingsView();
    else m.innerHTML = addView();
    renderSheet();
    renderTimers();
  }

  function loadingOrEmpty(list, emptyTitle, emptyText) {
    if (!S.loaded) return `<div class="empty"><span class="working"><span class="spin"></span>Loading recipes…</span></div>`;
    if (S.err) return `<div class="empty"><strong>Something went wrong</strong>${esc(S.err)}</div>`;
    if (!list.length) return `<div class="empty"><strong>${emptyTitle}</strong>${emptyText}</div>`;
    return "";
  }

  function activityHTML() {
    const ev = activity(S.actMore ? 25 : 4);
    if (!ev.length || S.q || S.tag || S.coll) return "";
    return `<section class="activity" aria-label="Kitchen activity"><div class="section-head" style="margin-top:6px"><h2>Lately in the kitchen</h2></div>
      <div class="act-list">${ev.map((e) => `<button class="act" data-open="${esc(e.r.id)}">
        <span class="avatar" aria-hidden="true">${esc(initials(e.by))}</span>
        <span class="act-text">${activityText(e)}${e.t > S.lastSeen && e.by !== S.me && S.lastSeen ? ' <span class="new">New</span>' : ""}</span>
        <span class="when">${esc(ago(e.t))}</span></button>`).join("")}</div>
      ${activity(26).length > 4 ? `<button class="linkish" data-act="act-more">${S.actMore ? "Show less" : "Show more"}</button>` : ""}</section>`;
  }

  function pantryHTML() {
    if (!S.pantryOpen) return "";
    const res = S.pantry.trim() ? pantryMatches(S.pantry) : null;
    return `<section class="panel pantry" aria-label="What can I make">
      <div class="row" style="justify-content:space-between"><h2 style="font-size:1.15rem">What can I make?</h2><button class="btn ghost" data-act="pantry-close" style="padding:6px 12px">Close</button></div>
      <label for="pantryIn">What's in the fridge?<span class="hint">Separate with commas. Salt, pepper and oil are assumed.</span>
        <input id="pantryIn" type="text" value="${esc(S.pantry)}" placeholder="chicken, spinach, feta, lemon" autocomplete="off"></label>
      <div id="pantryRes">${pantryResultsHTML(res)}</div></section>`;
  }
  function pantryResultsHTML(res) {
    if (!res) return "";
    if (!res.length) return `<p class="note" style="margin:0">No saved recipes use those yet. Try fewer or simpler words, like "chicken" instead of "chicken thighs".</p>`;
    return `<div class="grid-gap" style="gap:8px">${res.map((x) => `<button class="pm" data-open="${esc(x.r.id)}">
      <b>${esc(x.r.title)}</b>
      <span class="pm-meta">${x.missing.length ? `Have ${x.hit} of ${x.total} · need ${esc(x.missing.slice(0, 4).join(", "))}${x.missing.length > 4 ? "…" : ""}` : `<span class="ok">You have everything</span>`}</span></button>`).join("")}</div>`;
  }

  function feedView() {
    const list = filtered(S.recipes.slice().sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0)));
    const filt = S.q || S.tag || S.coll;
    const e = loadingOrEmpty(list, filt ? "No matches" : "Your stash is empty", filt ? "Try another search, tag or collection." : 'Tap <b>Add recipe</b> to save a link, paste a text, or snap a screenshot.');
    return `${S.pantryOpen ? "" : `<div class="row" style="margin:2px 0 4px"><button class="btn small" data-act="pantry-open">What can I make?</button></div>`}
      ${pantryHTML()}
      ${activityHTML()}
      <div class="section-head"><h2>${filt ? (S.coll ? esc(S.coll) : "Results") : "Our stash"}</h2><span class="count">${list.length}</span></div>
      ${e || `<div class="feed">${list.map(cardHTML).join("")}</div>`}`;
  }

  function planView() {
    const start = weekStart(S.weekOffset);
    const days = [...Array(7)].map((_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return ymd(d); });
    const inWeek = S.plan.filter((p) => days.includes(p.date));
    const wants = S.recipes.filter((r) => r.want).sort((a, b) => (b.wantAt || 0) - (a.wantAt || 0));
    const today = ymd(new Date());
    const label = S.weekOffset === 0 ? "This week" : S.weekOffset === 1 ? "Next week" : S.weekOffset === -1 ? "Last week" : "Week of " + new Date(days[0] + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
    const pickList = () => {
      const q = S.planQ.trim().toLowerCase();
      const pool = S.recipes.slice().sort((a, b) => (b.want ? 1 : 0) - (a.want ? 1 : 0) || (b.updatedAt || 0) - (a.updatedAt || 0))
        .filter((r) => !q || (r.title + " " + (r.tags || []).join(" ")).toLowerCase().includes(q)).slice(0, 8);
      return `<div class="pick"><input id="planQ" type="search" placeholder="Search your stash" value="${esc(S.planQ)}" aria-label="Search recipes to plan" autocomplete="off">
        <div class="pick-list" id="pickList">${pool.map((r) => `<button data-plan-choose="${esc(r.id)}">${r.want ? '<span class="pill want">Want</span> ' : ""}${esc(r.title)}</button>`).join("") || '<p class="note">No matches.</p>'}</div>
        <button class="linkish" data-act="plan-pick-close">Cancel</button></div>`;
    };
    return `<div class="section-head"><h2>Meal plan</h2>
        <div class="row week-nav"><button class="btn small ghost" data-week="-1" aria-label="Previous week">‹</button><span class="count">${esc(label)}</span><button class="btn small ghost" data-week="1" aria-label="Next week">›</button></div></div>
      <div class="days">${days.map((d) => {
        const items = S.plan.filter((p) => p.date === d).sort((a, b) => a.createdAt - b.createdAt);
        return `<div class="day${d === today ? " today" : ""}${d < today ? " past" : ""}">
          <div class="day-head"><span class="day-name">${esc(dayLabel(d, true))}</span>${S.canWrite ? `<button class="btn small ghost" data-plan-add="${d}" aria-label="Add a recipe to ${esc(dayLabel(d, true))}">+ Add</button>` : ""}</div>
          ${items.map((p) => { const r = getRecipe(p.recipeId); if (!r) return ""; const img = imgUrl(r);
            return `<div class="plan-item"><button class="plan-open" data-open="${esc(r.id)}">${img ? `<span class="pthumb">${imgTag(img, "")}</span>` : ""}<span>${esc(r.title)}</span></button>
              ${S.canWrite ? `<button class="x" data-plan-del="${esc(p.id)}" aria-label="Remove ${esc(r.title)} from ${esc(dayLabel(d))}">×</button>` : ""}</div>`; }).join("")}
          ${S.planPick === d ? pickList() : ""}
        </div>`; }).join("")}</div>
      ${inWeek.length ? `<div class="row" style="margin-top:12px"><button class="btn herb" data-act="plan-groceries">Add ${S.weekOffset === 0 ? "this week's" : "the week's"} groceries</button></div>` : ""}
      <div class="section-head" style="margin-top:22px"><h2>Want to make</h2><span class="count">${wants.length}</span></div>
      ${wants.length ? `<div class="feed">${wants.map(cardHTML).join("")}</div>` : `<div class="empty"><strong>Nothing queued</strong>Open any recipe and tap <b>Want to make</b> to line it up here.</div>`}`;
  }

  function groceryView() {
    const items = S.grocery;
    const left = items.filter((g) => !g.done).length;
    const done = items.length - left;
    let body;
    if (!items.length) body = `<div class="empty"><strong>List is empty</strong>Add ingredients from a recipe or the meal plan, or type an item below.</div>`;
    else if (S.gView === "aisle") {
      const rows = mergedGrocery();
      const order = ["Produce", "Meat & seafood", "Dairy & eggs", "Bakery", "Canned & jarred", "Pantry", "Spices & seasonings", "Frozen", "Drinks", "Other"];
      const by = {};
      rows.forEach((r) => (by[r.aisle] = by[r.aisle] || []).push(r));
      body = order.filter((a) => by[a]).map((a) => `<div class="g-group"><h3>${esc(a)}</h3>${by[a].sort((x, y) => (x.done ? 1 : 0) - (y.done ? 1 : 0)).map((r) => `
        <div class="g-item${r.done ? " done" : ""}">
          <input type="checkbox" id="gm-${esc(r.ids[0])}" data-gtoggle-many="${esc(r.ids.join(","))}" ${r.done ? "checked" : ""}>
          <span><label for="gm-${esc(r.ids[0])}" style="font-weight:400;display:inline">${esc(r.text)}</label>${r.sources.length ? `<small class="g-src">${esc(r.sources.join(", "))}</small>` : ""}</span>
          <button class="x" data-gdel-many="${esc(r.ids.join(","))}" aria-label="Remove ${esc(r.text)}">×</button>
        </div>`).join("")}</div>`).join("");
    } else {
      const groupsBy = {};
      items.forEach((g) => { const k = g.recipeTitle || "Extras"; (groupsBy[k] = groupsBy[k] || []).push(g); });
      body = Object.entries(groupsBy).map(([k, gs]) => `<div class="g-group"><h3>${esc(k)}</h3>${gs.map((g) => `
          <div class="g-item${g.done ? " done" : ""}">
            <input type="checkbox" id="g-${esc(g.id)}" data-gtoggle="${esc(g.id)}" ${g.done ? "checked" : ""}>
            <span><label for="g-${esc(g.id)}" style="font-weight:400;display:inline">${esc(g.text)}</label></span>
            <button class="x" data-gdel="${esc(g.id)}" aria-label="Remove ${esc(g.text)}">×</button>
          </div>`).join("")}</div>`).join("");
    }
    return `<div class="section-head"><h2>Groceries</h2><span class="count">${left} to get${done ? ` · ${done} in cart` : ""}</span></div>
      <form class="search" id="gAdd" style="margin-bottom:10px"><input id="gText" type="text" placeholder="Add an item (e.g. lemons)" aria-label="Add grocery item"><button class="btn herb" type="submit">Add</button></form>
      ${items.length ? `<div class="seg" role="group" aria-label="Sort the list" style="grid-template-columns:1fr 1fr;margin-bottom:10px">
        <button data-gview="aisle" aria-pressed="${S.gView === "aisle"}">By store aisle</button><button data-gview="recipe" aria-pressed="${S.gView === "recipe"}">By recipe</button></div>` : ""}
      <div class="grid-gap">${body}</div>
      ${items.length ? `<div class="row" style="margin-top:14px">
        <button class="btn" data-act="g-copy">Copy list</button>
        ${done ? `<button class="btn" data-act="g-clear-done">Clear checked</button>` : ""}
